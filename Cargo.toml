[workspace]
resolver = "3"
members = [
    "crates/bern-core",
    "crates/bern-macros",
    "crates/bern-web",
    "crates/bern-web-runtime",
    "crates/bern-server",
    "examples/basic",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0.117", features = ["full"] }
quote = "1.0.45"
proc-macro2 = "1.0"
wasm-bindgen = "=0.2.126"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
tower-http = { version = "0.6.11", features = ["fs"] }
futures-util = "0.3.32"
