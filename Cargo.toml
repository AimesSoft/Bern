[workspace]
resolver = "3"
# The GTK and GPUI runtimes build only inside generated applications.
exclude = ["crates/bern-gtk", "crates/bern-gpui"]
members = [
    "crates/bern-protocol",
    "crates/bern-syntax",
    "crates/bern-ir",
    "crates/bern-command",
    "crates/bern-media",
    "crates/bern-image",
    "crates/bern-svg",
    "crates/bern-script",
    "crates/bern-runtime",
    "crates/bern-theme",
    "crates/bern-adapter-json",
    "crates/bern-transport-ipc",
    "crates/bern-transport-ws",
    "crates/bern-ffi",
    "crates/bern-adapter-cli",
    "crates/bern-adapter-mcp",
    "crates/bern-cli",
    "crates/bern-macros",
    "crates/bern",
    "crates/bern-target-api",
    "crates/bern-compiler",
    "crates/bern-backend-swiftui",
    "crates/bern-backend-web",
    "crates/bern-backend-gtk",
    "crates/bern-backend-gpui",
    "crates/bern-backend-winui3",
    "crates/bern-backend-compose",
    "examples/showcase/showcase-protocol",
    "examples/showcase/showcase-core",
    "examples/showcase/showcase-ui",
    "examples/showcase/showcase-widgets",
    "examples/hello/hello-protocol",
    "examples/hello/hello-core",
    "examples/hello/hello-ui",
    "examples/svg-animation/svg-demo-protocol",
    "examples/svg-animation/svg-demo-core",
    "examples/svg-animation/svg-demo-ui",
    "examples/planner/planner-protocol",
    "examples/planner/planner-core",
    "examples/planner/planner-ui",
    "examples/planner/modules/notes/protocol",
    "examples/planner/modules/notes/core",
    "examples/planner/modules/notes/ui",
    "examples/planner/modules/tags/protocol",
    "examples/planner/modules/tags/core",
    "examples/gallery/gallery-protocol",
    "examples/gallery/gallery-core",
    "examples/gallery/gallery-ui",
    "examples/framework-names/names-protocol",
    "examples/framework-names/names-core",
    "examples/framework-names/names-ui",
    "examples/catalog/catalog-protocol",
    "examples/catalog/catalog-core",
    "examples/catalog/catalog-ui",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/AimesSoft/Bern"

[workspace.dependencies]
# The Bern crates are released together, each requiring the others at
# exactly its own version: crates.io gets them in one go (release.yml).
bern = { version = "=0.1.4", path = "crates/bern" }
bern-macros = { version = "=0.1.4", path = "crates/bern-macros" }
bern-syntax = { version = "=0.1.4", path = "crates/bern-syntax" }
bern-protocol = { version = "=0.1.4", path = "crates/bern-protocol" }
bern-ir = { version = "=0.1.4", path = "crates/bern-ir" }
bern-command = { version = "=0.1.4", path = "crates/bern-command" }
bern-media = { version = "=0.1.4", path = "crates/bern-media" }
bern-image = { version = "=0.1.4", path = "crates/bern-image" }
bern-svg = { version = "=0.1.4", path = "crates/bern-svg" }
bern-script = { version = "=0.1.4", path = "crates/bern-script" }
bern-runtime = { version = "=0.1.4", path = "crates/bern-runtime" }
bern-theme = { version = "=0.1.4", path = "crates/bern-theme" }
bern-target-api = { version = "=0.1.4", path = "crates/bern-target-api" }
bern-compiler = { version = "=0.1.4", path = "crates/bern-compiler" }
bern-backend-swiftui = { version = "=0.1.4", path = "crates/bern-backend-swiftui" }
bern-backend-web = { version = "=0.1.4", path = "crates/bern-backend-web" }
bern-backend-gtk = { version = "=0.1.4", path = "crates/bern-backend-gtk" }
bern-backend-gpui = { version = "=0.1.4", path = "crates/bern-backend-gpui" }
bern-backend-winui3 = { version = "=0.1.4", path = "crates/bern-backend-winui3" }
bern-backend-compose = { version = "=0.1.4", path = "crates/bern-backend-compose" }
bern-adapter-json = { version = "=0.1.4", path = "crates/bern-adapter-json" }
bern-transport-ipc = { version = "=0.1.4", path = "crates/bern-transport-ipc" }
bern-transport-ws = { version = "=0.1.4", path = "crates/bern-transport-ws" }
bern-adapter-cli = { version = "=0.1.4", path = "crates/bern-adapter-cli" }
bern-adapter-mcp = { version = "=0.1.4", path = "crates/bern-adapter-mcp" }
bern-ffi = { version = "=0.1.4", path = "crates/bern-ffi" }
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
quote = "1.0.45"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8.23"
libc = "0.2.186"
