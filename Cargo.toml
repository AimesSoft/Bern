[workspace]
resolver = "3"
# The GTK runtime builds only inside generated Linux applications.
exclude = ["crates/bern-gtk"]
members = [
    "crates/bern-protocol",
    "crates/bern-syntax",
    "crates/bern-ir",
    "crates/bern-command",
    "crates/bern-media",
    "crates/bern-image",
    "crates/bern-svg",
    "crates/bern-runtime",
    "crates/bern-theme",
    "crates/bern-adapter-json",
    "crates/bern-transport-ipc",
    "crates/bern-transport-ws",
    "crates/bern-ffi",
    "crates/bern-adapter-cli",
    "crates/bern-adapter-mcp",
    "crates/bern-cli",
    "crates/bern-macros",
    "crates/bern",
    "crates/bern-target-api",
    "crates/bern-compiler",
    "crates/bern-backend-swiftui",
    "crates/bern-backend-web",
    "crates/bern-backend-gtk",
    "crates/bern-backend-winui3",
    "crates/bern-backend-compose",
    "examples/showcase/showcase-protocol",
    "examples/showcase/showcase-core",
    "examples/showcase/showcase-ui",
    "examples/showcase/showcase-widgets",
    "examples/hello/hello-protocol",
    "examples/hello/hello-core",
    "examples/hello/hello-ui",
    "examples/svg-animation/svg-demo-protocol",
    "examples/svg-animation/svg-demo-core",
    "examples/svg-animation/svg-demo-ui",
    "examples/planner/planner-protocol",
    "examples/planner/planner-core",
    "examples/planner/planner-ui",
    "examples/planner/modules/notes/protocol",
    "examples/planner/modules/notes/core",
    "examples/planner/modules/notes/ui",
    "examples/planner/modules/tags/protocol",
    "examples/planner/modules/tags/core",
    "examples/gallery/gallery-protocol",
    "examples/gallery/gallery-core",
    "examples/gallery/gallery-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
bern = { path = "crates/bern" }
bern-macros = { path = "crates/bern-macros" }
bern-syntax = { path = "crates/bern-syntax" }
bern-protocol = { path = "crates/bern-protocol" }
bern-ir = { path = "crates/bern-ir" }
bern-command = { path = "crates/bern-command" }
bern-media = { path = "crates/bern-media" }
bern-image = { path = "crates/bern-image" }
bern-svg = { path = "crates/bern-svg" }
bern-runtime = { path = "crates/bern-runtime" }
bern-theme = { path = "crates/bern-theme" }
bern-target-api = { path = "crates/bern-target-api" }
bern-compiler = { path = "crates/bern-compiler" }
bern-backend-swiftui = { path = "crates/bern-backend-swiftui" }
bern-backend-web = { path = "crates/bern-backend-web" }
bern-backend-gtk = { path = "crates/bern-backend-gtk" }
bern-backend-winui3 = { path = "crates/bern-backend-winui3" }
bern-backend-compose = { path = "crates/bern-backend-compose" }
bern-adapter-json = { path = "crates/bern-adapter-json" }
bern-transport-ipc = { path = "crates/bern-transport-ipc" }
bern-transport-ws = { path = "crates/bern-transport-ws" }
bern-adapter-cli = { path = "crates/bern-adapter-cli" }
bern-adapter-mcp = { path = "crates/bern-adapter-mcp" }
bern-ffi = { path = "crates/bern-ffi" }
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
quote = "1.0.45"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8.23"
libc = "0.2.186"
