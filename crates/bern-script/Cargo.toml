[package]
name = "bern-script"
description = "Target-selected JavaScript contexts for Bern applications"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Turned on by the project Bern generates, for a target with no system host.
# An application asks for `javascript = true` and leaves the host to Bern; only
# its tests, with no target to run in, turn this on, as a dev-dependency.
boa = ["dep:boa_engine"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
boa_engine = { version = "0.22", default-features = false, optional = true }
