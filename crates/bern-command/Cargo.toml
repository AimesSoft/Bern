[package]
name = "bern-command"
description = "Command catalog host shared by the UI, CLI, JSON and MCP entries"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bern-protocol.workspace = true

# The system credential stores behind `secrets`.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = "3"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
serde_json.workspace = true
