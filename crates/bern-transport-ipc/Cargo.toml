[package]
name = "bern-transport-ipc"
description = "Local IPC control channel that connects external entries to a running engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bern-protocol.workspace = true
bern-media.workspace = true
bern-command.workspace = true
bern-runtime.workspace = true
bern-adapter-json.workspace = true
