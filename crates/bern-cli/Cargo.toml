[package]
name = "bern-cli"
description = "`bern`: builds Bern applications for their configured targets"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "bern"
path = "src/main.rs"

# `cargo binstall bern-cli` downloads `bern` from the release of its
# version instead of compiling it: the archives release.yml attaches.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/bern-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
bern-command.workspace = true
bern-compiler.workspace = true
bern-protocol.workspace = true
bern-syntax.workspace = true
bern-transport-ws.workspace = true
bern-target-api.workspace = true
bern-backend-swiftui.workspace = true
bern-backend-web.workspace = true
bern-backend-gtk.workspace = true
bern-backend-gpui.workspace = true
bern-backend-winui3.workspace = true
bern-backend-compose.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
bern-ir.workspace = true
bern-svg.workspace = true
png = "0.18"
