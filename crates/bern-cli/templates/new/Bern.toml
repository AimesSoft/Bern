# {{name}}, a Bern application. `bern run` builds it and starts it on this
# computer; `bern build --target <name>` builds one of the targets below.

[app]
id = "{{id}}"
# Change this to a reverse-DNS name you own before you ship.
bundle_id = "{{bundle_id}}"
version = "0.1.0"
name = { {{app_names}} }
# A square PNG of 1024 pixels; without it the app uses the Bern logo.
# icon = "icon.png"
# Or a table giving platforms their own icons, as a square PNG or in the
# platform's own form; `default` covers the rest:
# icon = { default = "icon.png", macos = "icons/App.icns", windows = "icons/app.ico", ios = "icons/AppIcon.appiconset", android = "icons/android/res", linux = "icons/hicolor", browser = "icons/web" }
# macOS and iOS also take an Icon Composer document (`icons/App.icon`),
# shown in Liquid Glass from macOS 26 and iOS 26 on.
# Shown by installers and package managers.
# publisher = "Your Name"

[languages]
supported = [{{languages}}]
default = "{{default_language}}"

[protocol]
package = "{{package}}-protocol"
source = "{{package}}-protocol/src/lib.rs"

[engine]
package = "{{package}}-core"
type = "{{id}}_core::{{engine}}"

[ui]
package = "{{package}}-ui"
sources = ["{{package}}-ui/src/lib.rs"]
root = "app"

# `channels = ["ipc"]` lets the generated command line and MCP server drive
# the running app. Remove it to ship an app that listens to nothing.

[targets.macos]
platform = "macos"
channels = ["ipc"]

# iOS, built for the simulator; `bern run --target ios` starts it in the
# simulator that is running.
[targets.ios]
platform = "ios"
channels = ["ipc"]

[targets.windows]
platform = "windows"
channels = ["ipc"]
# WinUI 3 where Windows has a Windows App Runtime 2, the system XAML
# elsewhere. Name one front end to build only that one.
# frontends = ["winui3", "xaml-islands"]

[targets.linux]
platform = "linux"
channels = ["ipc"]

# Android phones; `bern run --target android` installs the app on the
# connected device and starts it.
[targets.android]
platform = "android"
channels = ["ipc"]

[targets.web_app]
ui = "web"
platform = "browser"
web_mode = "app"
