[package]
name = "bern-transport-ws"
description = "The engine host's browser channel: the WebUI page over HTTP and JSON control messages over WebSocket on the loopback interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bern-protocol.workspace = true
bern-command.workspace = true
bern-runtime.workspace = true
bern-media.workspace = true
bern-adapter-json.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# The system random number generator; Unix reads /dev/urandom.
getrandom = "0.3"

[dev-dependencies]
bern-ffi = { workspace = true, features = ["remote"] }
