[package]
name = "bern-ffi"
description = "In-process C ABI between native UI frontends and the Bern runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bern-protocol.workspace = true
bern-command.workspace = true
bern-runtime.workspace = true
bern-media.workspace = true
bern-transport-ipc = { workspace = true, optional = true }

[features]
default = ["ipc"]
# The local control channel for CLI, JSON and MCP entries (Unix sockets).
ipc = ["dep:bern-transport-ipc"]
