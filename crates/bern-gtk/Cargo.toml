[package]
name = "bern-gtk"
description = "GTK 4 runtime of the `gtk + linux` target: libadwaita widgets bound to the Bern session runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
publish = false

# Built only for Linux applications, by the crates `bern build` generates.
# It is not a member of the Bern workspace, so GTK is never a requirement
# for building the other targets.
[workspace]

[dependencies]
bern-ffi = { path = "../bern-ffi" }
bern-image = { path = "../bern-image" }
libc = "0.2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
glib = "0.22"
gio = "0.22"
