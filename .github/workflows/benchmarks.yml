# Measure the same Hello World in Bern and in other cross-platform
# frameworks on one Mac: package size, time to the first window, memory.
# Each framework builds in its own job; one job then measures them all on
# the same machine, taking turns, so that they meet the same conditions.
# Run it from the Actions tab; the results are the artifact
# `benchmark-results` (results.json), which the README charts read.
name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner label. GitHub's hosted macOS runners are Apple silicon
          virtual machines; for an Apple M4, register a self-hosted runner
          with a label such as `m4` and give that label here.
        default: macos-latest
        type: string
      runs:
        description: Measured launches per framework (after one warm-up)
        default: "10"
        type: string
      frameworks:
        description: Frameworks to build and measure, separated by spaces
        default: bern gpui dioxus tauri electron flutter react-native avalonia qt
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      frameworks: ${{ steps.list.outputs.frameworks }}
    steps:
      - id: list
        env:
          FRAMEWORKS: ${{ inputs.frameworks }}
        run: echo "frameworks=$(python3 -c 'import json, os; print(json.dumps(os.environ["FRAMEWORKS"].split()))')" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.framework }}
    needs: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.plan.outputs.frameworks) }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.framework == 'avalonia'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - if: matrix.framework == 'electron' || matrix.framework == 'react-native'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build
        run: benchmarks/build.sh ${{ matrix.framework }} built
      - uses: actions/upload-artifact@v5
        with:
          name: build-${{ matrix.framework }}
          path: built/
          if-no-files-found: error
          compression-level: 0

  measure:
    needs: build
    # Measure whatever built; a framework that failed to build is left out.
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: build-*
          path: built
          merge-multiple: true
      - name: Measure
        env:
          RUNS: ${{ inputs.runs }}
        run: benchmarks/measure.sh built "$RUNS"
      - uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: built/results.json
