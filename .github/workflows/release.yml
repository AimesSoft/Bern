# Releases Bern for a tag like v0.2.0, which must name the crates' version:
# builds `bern` for macOS, Linux and Windows, attaches the archives to a
# GitHub release, where `cargo binstall bern-cli` finds them, then publishes
# every Bern crate to crates.io with the CARGO_REGISTRY_TOKEN secret. A pull
# request that changes the release builds the archives and packages the
# crates without publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/publish-crates.py

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bern:
    name: bern (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, runs: true }
          - { os: macos-15, target: x86_64-apple-darwin, runs: false }
          # The oldest glibc the runners have, so `bern` runs on the
          # distributions after it. bern-command's keyring links the
          # system's libdbus, which a static musl build cannot.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, runs: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, runs: true }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, runs: true }
          - { os: windows-2025, target: aarch64-pc-windows-msvc, runs: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install rustup
        if: runner.os == 'Linux'
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install libdbus
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # rustup installs the toolchain rust-toolchain.toml names.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p bern-cli --target ${{ matrix.target }}
      - name: Run it
        if: matrix.runs
        run: target/${{ matrix.target }}/release/bern --version
      - name: Archive
        run: |
          program=bern
          if [[ "${{ matrix.target }}" == *windows* ]]; then program=bern.exe; fi
          mkdir archive
          cp "target/${{ matrix.target }}/release/$program" LICENSE archive/
          cd archive
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "../bern-${{ matrix.target }}.zip" "$program" LICENSE
          else
            tar -czf "../bern-${{ matrix.target }}.tar.gz" "$program" LICENSE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bern-${{ matrix.target }}
          path: bern-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: bern
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bern ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag

  crates:
    name: crates.io
    needs: [bern, release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    # crates.io takes one new crate every ten minutes after the first few,
    # so the first release spends most of this waiting.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      # bern-gtk builds against them when it is published.
      - name: Install GTK 4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev
      - run: rustup toolchain install
      - name: Package
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/publish-crates.py --dry-run
      - name: Publish
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 .github/scripts/publish-crates.py --tag "$GITHUB_REF_NAME"
