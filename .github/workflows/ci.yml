# Checks every push to master and every pull request on Linux: formatting,
# Clippy and the tests of the workspace, the JavaScript runtimes' tests, and
# the GTK runtime, which is not a workspace member because only generated
# Linux applications build it. With GTK installed, the GTK backend's tests
# also type-check a generated application. Apple, Windows and Android
# toolchains are not on these runners; tests that need one of them check
# what they can without it.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK 4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev
      # rustup installs the toolchain rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: workspace-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: workspace-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  javascript:
    name: JavaScript runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/bern-playwright" playwright@1.58.2
          "$RUNNER_TEMP/bern-playwright/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Test JavaScript runtimes and browser hit testing
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/bern-playwright/node_modules/playwright/index.mjs
        run: node --test crates/bern-svg/tests/*.test.mjs crates/bern-backend-web/tests/*.test.mjs crates/bern-script/tests/*.test.mjs
      - name: Test WebUI control bridge
        run: python3 crates/bern-backend-web/tests/control-bridge.test.py

  gtk:
    name: bern-gtk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/bern-gtk
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK 4, libadwaita and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev libdbus-1-dev
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/bern-gtk/target
          key: gtk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'crates/bern-gtk/Cargo.toml') }}
          restore-keys: gtk-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
