# Checks every push to master and every pull request on Linux: formatting,
# Clippy and the tests of the workspace, and of the GTK runtime, which is
# not a workspace member because only generated Linux applications build it.
# Apple, Windows and Android toolchains are not on these runners; tests
# that need one of them pass without it or check what they can.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # rustup installs the toolchain rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: workspace-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: workspace-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  gtk:
    name: bern-gtk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates/bern-gtk
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK 4, libadwaita, GStreamer and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libwebkitgtk-6.0-dev
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/bern-gtk/target
          key: gtk-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'crates/bern-gtk/Cargo.toml') }}
          restore-keys: gtk-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo test --all-features
