# Bern project configuration for the control showcase.

[app]
id = "showcase"
bundle_id = "dev.bern.showcase"
version = "0.1.0"
name = { "zh-Hans" = "Bern 控件展示", "en" = "Bern Showcase" }

[languages]
supported = ["zh-Hans", "en"]
default = "zh-Hans"
strict = true

[theme]
mode = "system"

[protocol]
package = "showcase-protocol"
source = "showcase-protocol/src/lib.rs"

[engine]
package = "showcase-core"
type = "showcase_core::ShowcaseEngine"

[ui]
package = "showcase-ui"
sources = [
    "showcase-ui/src/lib.rs",
    "showcase-ui/src/pages.rs",
    "showcase-ui/src/media.rs",
    "showcase-ui/src/settings.rs",
]
root = "app"

# Component libraries the UI uses, each with its own Bern.toml.
[[libraries]]
manifest = "showcase-widgets/Bern.toml"

# Files that ship inside the built app. Each path is relative to this file
# and is also the name the engine resolves at run time. The HLS stream in
# media/live is served over HTTP during development and does not ship.
[resources]
paths = ["media/aurora.mp4", "media/tides.mp4", "media/broken.mp4"]

[targets.macos]
platform = "macos"
# Entries besides the UI. "ipc" assembles the local control channel used by
# the generated CLI, JSON clients and MCP server; omit it for no listener.
channels = ["ipc"]

# The same app as a web page with the engine compiled to WebAssembly.
[targets.web_app]
ui = "web"
platform = "browser"
web_mode = "app"

# The WebUI build: the page connects to a separate engine host, which also
# serves the CLI, JSON and MCP entries through its IPC channel.
[targets.web_ui]
ui = "web"
platform = "browser"
web_mode = "ui"
application_transport = "websocket"
application_codec = "json"
channels = ["ipc"]
