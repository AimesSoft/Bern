<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 439.5" width="960" height="439.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#AFB8C1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A8BEF"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="438.5" rx="20" fill="#FFFFFF" stroke="#D0D7DE"/>
<rect x="24.0" y="24" width="293.3333333333333" height="391.5" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(24.0 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18"/></g><text x="22.0" y="93.8" font-size="17.5" fill="#1F2328" font-weight="700">编译成原生界面</text><text x="22.0" y="126.3" font-size="14.5" fill="#1F2328">一份 Rust 声明，编译成 SwiftUI、</text><text x="22.0" y="148.3" font-size="14.5" fill="#1F2328">WinUI 3、GTK 4、Jetpack</text><text x="22.0" y="170.3" font-size="14.5" fill="#1F2328">Compose 与 Web。</text><g transform="translate(21.0 190.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="44.0" y="202.2" font-size="14" fill="#1F2328">构建时生成各平台自己的 UI 代码</text><g transform="translate(21.0 214.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="44.0" y="226.2" font-size="14" fill="#1F2328">运行时没有 JS 引擎，没有虚拟 DOM</text><g transform="translate(21.0 238.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="44.0" y="250.2" font-size="14" fill="#1F2328">界面就是系统控件本身</text><text x="22.0" y="282.6" font-size="13" fill="#59636E">目标和 React Native 相近，做法不同：</text><text x="22.0" y="302.1" font-size="13" fill="#59636E">React Native 在运行时用 JS 引擎协调原</text><text x="22.0" y="321.6" font-size="13" fill="#59636E">生视图。</text></g>
<rect x="333.3333333333333" y="24" width="293.3333333333333" height="391.5" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(333.3 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M11 3.5c.6 4.3 3.2 6.9 7.5 7.5-4.3.6-6.9 3.2-7.5 7.5-.6-4.3-3.2-6.9-7.5-7.5 4.3-.6 6.9-3.2 7.5-7.5z"/><path d="M19 15.5v5M16.5 18h5"/></g><text x="22.0" y="93.8" font-size="17.5" fill="#1F2328" font-weight="700">为 AI 而建：写得对，用得上</text><rect x="22.0" y="111.0" width="77.0" height="22" rx="11.0" fill="#DDF4FF"/><text x="60.5" y="126.3" font-size="12" font-weight="600" text-anchor="middle" fill="#0969DA">AI 写代码</text><text x="22.0" y="158.2" font-size="14" fill="#1F2328">漏掉的翻译、漏掉的界面入口、没登记</text><text x="22.0" y="180.2" font-size="14" fill="#1F2328">的按钮、没命令化的操作，都是编译错</text><text x="22.0" y="202.2" font-size="14" fill="#1F2328">误，并指到具体的文件和行。</text><rect x="22.0" y="219.0" width="77.0" height="22" rx="11.0" fill="#DDF4FF"/><text x="60.5" y="234.3" font-size="12" font-weight="600" text-anchor="middle" fill="#0969DA">AI 用应用</text><text x="22.0" y="266.2" font-size="14" fill="#1F2328">每个按钮都是 MCP 工具：读的是控件的</text><text x="22.0" y="288.2" font-size="14" fill="#1F2328">语义，走和鼠标点击相同的代码路径，</text><text x="22.0" y="310.2" font-size="14" fill="#1F2328">不靠截图，不靠坐标。</text></g>
<rect x="642.6666666666666" y="24" width="293.3333333333333" height="391.5" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(642.7 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5z"/></g><text x="22.0" y="93.8" font-size="17.5" fill="#1F2328" font-weight="700">轻到不像跨平台</text><text x="22.0" y="126.2" font-size="14" fill="#1F2328">桌面上不带浏览器内核和 JS 引擎，业</text><text x="22.0" y="148.2" font-size="14" fill="#1F2328">务引擎编译成原生代码，运行在应用进</text><text x="22.0" y="170.2" font-size="14" fill="#1F2328">程内。</text><text x="96.0" y="201" font-size="12" fill="#59636E">内存</text><text x="154.4" y="201" font-size="12" fill="#59636E">出窗口</text><text x="212.9" y="201" font-size="12" fill="#59636E">体积</text><line x1="22" y1="211.0" x2="271.3333333333333" y2="211.0" stroke="#E6EAEF"/><text x="22" y="231.0" font-size="13" fill="#59636E">macOS</text><text x="96.0" y="231.0" font-size="14.5" font-weight="700" fill="#1F2328">39 MB</text><text x="154.4" y="231.0" font-size="14.5" font-weight="700" fill="#1F2328">0.4 秒</text><text x="212.9" y="231.0" font-size="14.5" font-weight="700" fill="#1F2328">2.7 MB</text><line x1="22" y1="241.0" x2="271.3333333333333" y2="241.0" stroke="#E6EAEF"/><text x="22" y="261.0" font-size="13" fill="#59636E">Windows</text><text x="96.0" y="261.0" font-size="14.5" font-weight="700" fill="#1F2328">35 MB</text><text x="154.4" y="261.0" font-size="14.5" font-weight="700" fill="#1F2328">0.3 秒</text><text x="212.9" y="261.0" font-size="14.5" font-weight="700" fill="#1F2328">4.2 MB</text><line x1="22" y1="271.0" x2="271.3333333333333" y2="271.0" stroke="#E6EAEF"/><text x="22" y="291.0" font-size="13" fill="#59636E">Web</text><text x="96.0" y="291.0" font-size="14.5" font-weight="400" fill="#59636E">–</text><text x="154.4" y="291.0" font-size="14.5" font-weight="400" fill="#59636E">–</text><text x="212.9" y="291.0" font-size="14.5" font-weight="700" fill="#1F2328">189 KB</text><text x="22.0" y="324.6" font-size="13" fill="#59636E">release 版展示应用实测。Windows 不需</text><text x="22.0" y="344.1" font-size="13" fill="#59636E">要 .NET；Web 为 gzip 后，含 Rust 引</text><text x="22.0" y="363.6" font-size="13" fill="#59636E">擎。</text></g>
</svg>
