<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 266" width="960" height="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<g transform="translate(0.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="m7.5 10 3 2.5-3 2.5M13 15h3.5"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">每個操作都是命令</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1">按鈕不能掛上任意回呼，只能綁定命令目錄中</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">的一道型別化命令；參數、錯誤與重試策略由</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">介面、命令列、JSON 與 MCP 共用。</text></g>
<g transform="translate(336.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7 5.5-5.5"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">編譯期就做檢查</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">rustc</tspan> 檢查每個綁定與命令參數的型別。沒有</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">綁定命令的按鈕、任意回呼、讓控制項直接寫</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">入引擎狀態、缺少翻譯，都無法通過編譯。</text></g>
<g transform="translate(672.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">商業邏輯留在 Rust</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1">引擎是不依賴任何 UI 的一般 Rust 程式碼，</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">不開視窗也能測試。在桌面上它在應用程式行</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">程內執行，在瀏覽器中編譯為</text><text x="0.0" y="115.2" font-size="14" fill="#9198A1">WebAssembly。</text></g>
<g transform="translate(0.0 162.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.8" ry="9"/><path d="M3 12h18"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">從第一天起就在地化</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">tr!</tspan> 讓各語言文案緊鄰它所屬的介面。嚴格模</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">式的建置會拒絕缺漏的翻譯；執行中切換介面</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">語言不會遺失草稿。</text></g>
<g transform="translate(336.0 162.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">深淺色零設定</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1">顏色來自平台主題：深淺色、強調色、高對比</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">跟隨系統，宣告的品牌色對應為系統強調色。</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">Web 由 Bern 的主題核心產生整套配色。</text></g>
<g transform="translate(672.0 162.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><rect x="3" y="8.5" width="13" height="11" rx="2.5"/><path d="M8 8.5V7a2.5 2.5 0 0 1 2.5-2.5h8A2.5 2.5 0 0 1 21 7v6a2.5 2.5 0 0 1-2.5 2.5H16"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">宣告式多視窗</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1">每個視窗有自己的草稿、關閉檢查與儲存命</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">令；最小化、最大化、移動、調整大小也是命</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">令，以平台的實際狀態回覆。</text></g>
</svg>
