<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#484F58"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6EA2F5"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="439" rx="20" fill="#0D1117" stroke="#30363D"/>
<rect x="24.0" y="24" width="293.3333333333333" height="188" rx="14" fill="#151B23" stroke="#30363D"/>
<g transform="translate(24.0 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#14243D"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#6EA2F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="m7.5 10 3 2.5-3 2.5M13 15h3.5"/></g><g transform="translate(0.0 30.5)"><text x="74.0" y="16.5" font-size="16.5" fill="#F0F6FC" font-weight="700">每個操作都是命令</text></g><text x="22.0" y="93.2" font-size="14" fill="#9198A1">按鈕不能掛上任意回呼，只能綁定命令</text><text x="22.0" y="115.2" font-size="14" fill="#9198A1">目錄中的一道型別化命令；參數、錯誤</text><text x="22.0" y="137.2" font-size="14" fill="#9198A1">與重試策略由介面、命令列、JSON 與</text><text x="22.0" y="159.2" font-size="14" fill="#9198A1">MCP 共用。</text></g>
<rect x="333.3333333333333" y="24" width="293.3333333333333" height="188" rx="14" fill="#151B23" stroke="#30363D"/>
<g transform="translate(333.3 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#14243D"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#6EA2F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7 5.5-5.5"/></g><g transform="translate(0.0 30.5)"><text x="74.0" y="16.5" font-size="16.5" fill="#F0F6FC" font-weight="700">編譯期就做檢查</text></g><text x="22.0" y="93.2" font-size="14" fill="#9198A1"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">rustc</tspan> 檢查每個綁定與命令參數的型</text><text x="22.0" y="115.2" font-size="14" fill="#9198A1">別。沒有綁定命令的按鈕、任意回呼、</text><text x="22.0" y="137.2" font-size="14" fill="#9198A1">讓控制項直接寫入引擎狀態、缺少翻</text><text x="22.0" y="159.2" font-size="14" fill="#9198A1">譯，都無法通過編譯。</text></g>
<rect x="642.6666666666666" y="24" width="293.3333333333333" height="188" rx="14" fill="#151B23" stroke="#30363D"/>
<g transform="translate(642.7 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#14243D"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#6EA2F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5"/></g><g transform="translate(0.0 30.5)"><text x="74.0" y="16.5" font-size="16.5" fill="#F0F6FC" font-weight="700">商業邏輯留在 Rust</text></g><text x="22.0" y="93.2" font-size="14" fill="#9198A1">引擎是不依賴任何 UI 的一般 Rust 程</text><text x="22.0" y="115.2" font-size="14" fill="#9198A1">式碼，不開視窗也能測試。在桌面上它</text><text x="22.0" y="137.2" font-size="14" fill="#9198A1">在應用程式行程內執行，在瀏覽器中編</text><text x="22.0" y="159.2" font-size="14" fill="#9198A1">譯為 WebAssembly。</text></g>
<rect x="24.0" y="228" width="293.3333333333333" height="188" rx="14" fill="#151B23" stroke="#30363D"/>
<g transform="translate(24.0 228.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#14243D"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#6EA2F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.8" ry="9"/><path d="M3 12h18"/></g><g transform="translate(0.0 30.5)"><text x="74.0" y="16.5" font-size="16.5" fill="#F0F6FC" font-weight="700">從第一天起就在地化</text></g><text x="22.0" y="93.2" font-size="14" fill="#9198A1"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">tr!</tspan> 讓各語言文案緊鄰它所屬的介面。</text><text x="22.0" y="115.2" font-size="14" fill="#9198A1">嚴格模式的建置會拒絕缺漏的翻譯；執</text><text x="22.0" y="137.2" font-size="14" fill="#9198A1">行中切換介面語言不會遺失草稿。</text></g>
<rect x="333.3333333333333" y="228" width="293.3333333333333" height="188" rx="14" fill="#151B23" stroke="#30363D"/>
<g transform="translate(333.3 228.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#14243D"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#6EA2F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></g><g transform="translate(0.0 30.5)"><text x="74.0" y="16.5" font-size="16.5" fill="#F0F6FC" font-weight="700">深淺色零設定</text></g><text x="22.0" y="93.2" font-size="14" fill="#9198A1">顏色來自平台主題：深淺色、強調色、</text><text x="22.0" y="115.2" font-size="14" fill="#9198A1">高對比跟隨系統，宣告的品牌色對應為</text><text x="22.0" y="137.2" font-size="14" fill="#9198A1">系統強調色。Web 由 Bern 的主題核心</text><text x="22.0" y="159.2" font-size="14" fill="#9198A1">產生整套配色。</text></g>
<rect x="642.6666666666666" y="228" width="293.3333333333333" height="188" rx="14" fill="#151B23" stroke="#30363D"/>
<g transform="translate(642.7 228.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#14243D"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#6EA2F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><rect x="3" y="8.5" width="13" height="11" rx="2.5"/><path d="M8 8.5V7a2.5 2.5 0 0 1 2.5-2.5h8A2.5 2.5 0 0 1 21 7v6a2.5 2.5 0 0 1-2.5 2.5H16"/></g><g transform="translate(0.0 30.5)"><text x="74.0" y="16.5" font-size="16.5" fill="#F0F6FC" font-weight="700">宣告式多視窗</text></g><text x="22.0" y="93.2" font-size="14" fill="#9198A1">每個視窗有自己的草稿、關閉檢查與儲</text><text x="22.0" y="115.2" font-size="14" fill="#9198A1">存命令；最小化、最大化、移動、調整</text><text x="22.0" y="137.2" font-size="14" fill="#9198A1">大小也是命令，以平台的實際狀態回</text><text x="22.0" y="159.2" font-size="14" fill="#9198A1">覆。</text></g>
</svg>
