<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 595" width="960" height="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#AFB8C1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A8BEF"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="594" rx="20" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="32" y="40" font-size="13" font-weight="600" fill="#59636E">漏れたもの</text>
<text x="376" y="40" font-size="13" font-weight="600" fill="#59636E">Bern の扱い</text>
<line x1="24" y1="56" x2="936" y2="56" stroke="#D0D7DE"/>
<text x="32.0" y="90.0" font-size="15" fill="#1F2328" font-weight="600">ある文言の翻訳が一つ足りない</text>
<g transform="translate(336.0 76.5) scale(0.7500)" fill="none" stroke="#AFB8C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#AFB8C1"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<rect x="376.0" y="74.0" width="102.5" height="23" rx="11.5" fill="#FFEBE9"/><text x="427.2" y="90.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">error[B102]</text>
<text x="376.0" y="120.2" font-size="14" fill="#59636E">各言語は <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">tr!</tspan> で UI のすぐ隣にまとめて書くので、漏れが一目でわかります。直接書い</text>
<text x="376.0" y="142.2" font-size="14" fill="#59636E">たリテラルは B103（厳格モード、既定で有効）。</text>
<line x1="24" y1="167" x2="936" y2="167" stroke="#E6EAEF"/>
<text x="32.0" y="201.0" font-size="15" fill="#1F2328" font-weight="600">ある表示モードで機能に入口がない</text>
<g transform="translate(336.0 187.5) scale(0.7500)" fill="none" stroke="#AFB8C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#AFB8C1"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<rect x="376.0" y="185.0" width="102.5" height="23" rx="11.5" fill="#FFEBE9"/><text x="427.2" y="201.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">error[B201]</text>
<text x="376.0" y="231.2" font-size="14" fill="#59636E">ページは提供すべき機能を機能契約で宣言し、コンパイラーがレイアウト（<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">compact</tspan>、</text>
<text x="376.0" y="253.2" font-size="14" fill="#59636E"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">expanded</tspan>）ごとに各機能の入口を証明します。広い画面にあって狭い画面にないのも不</text>
<text x="376.0" y="275.2" font-size="14" fill="#59636E">可。</text>
<line x1="24" y1="300" x2="936" y2="300" stroke="#E6EAEF"/>
<text x="32.0" y="334.0" font-size="15" fill="#1F2328" font-weight="600">契約の範囲内の入口が機能に登録されて</text>
<text x="32.0" y="357.0" font-size="15" fill="#1F2328" font-weight="600">いない</text>
<g transform="translate(336.0 320.5) scale(0.7500)" fill="none" stroke="#AFB8C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#AFB8C1"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<rect x="376.0" y="318.0" width="102.5" height="23" rx="11.5" fill="#FFEBE9"/><text x="427.2" y="334.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">error[B202]</text>
<text x="376.0" y="364.2" font-size="14" fill="#59636E">逆も不可で、入口が自分の機能に属さないコマンドを実行すると B204。</text>
<line x1="24" y1="389" x2="936" y2="389" stroke="#E6EAEF"/>
<text x="32.0" y="423.0" font-size="15" fill="#1F2328" font-weight="600">入口が条件分岐の中にしかなく、常に使</text>
<text x="32.0" y="446.0" font-size="15" fill="#1F2328" font-weight="600">えると証明できない</text>
<g transform="translate(336.0 409.5) scale(0.7500)" fill="none" stroke="#AFB8C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#AFB8C1"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<rect x="376.0" y="407.0" width="102.5" height="23" rx="11.5" fill="#FFEBE9"/><text x="427.2" y="423.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#CF222E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">error[B203]</text>
<text x="376.0" y="453.2" font-size="14" fill="#59636E">人による保証を明示した場合を除きます。</text>
<line x1="24" y1="478" x2="936" y2="478" stroke="#E6EAEF"/>
<text x="32.0" y="512.0" font-size="15" fill="#1F2328" font-weight="600">ボタンに任意のコードをぶら下げたい</text>
<g transform="translate(336.0 498.5) scale(0.7500)" fill="none" stroke="#AFB8C1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#AFB8C1"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<rect x="376.0" y="496.0" width="85.6" height="23" rx="11.5" fill="#DDF4FF"/><text x="418.8" y="512.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0969DA">書けません</text>
<text x="376.0" y="542.2" font-size="14" fill="#59636E">ボタンはコマンドカタログの型付きコマンドにしか結び付けられず、コントロールがエ</text>
<text x="376.0" y="564.2" font-size="14" fill="#59636E">ンジンの状態を直接書き換えることもできません。</text>
</svg>
