<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#AFB8C1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A8BEF"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="549" rx="20" fill="#FFFFFF" stroke="#D0D7DE"/>
<rect x="24.0" y="24" width="293.3333333333333" height="232" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(24.0 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="m7.5 10 3 2.5-3 2.5M13 15h3.5"/></g><g transform="translate(0.0 19.0)"><text x="74.0" y="16.5" font-size="16.5" fill="#1F2328" font-weight="700">Every action is a</text><text x="74.0" y="39.5" font-size="16.5" fill="#1F2328" font-weight="700">command</text></g><text x="22.0" y="93.2" font-size="14" fill="#59636E">A button cannot hold an</text><text x="22.0" y="115.2" font-size="14" fill="#59636E">arbitrary callback. It binds to</text><text x="22.0" y="137.2" font-size="14" fill="#59636E">a command in one typed catalog,</text><text x="22.0" y="159.2" font-size="14" fill="#59636E">with parameters, errors and</text><text x="22.0" y="181.2" font-size="14" fill="#59636E">retry policy shared by the UI,</text><text x="22.0" y="203.2" font-size="14" fill="#59636E">the command line, JSON and MCP.</text></g>
<rect x="333.3333333333333" y="24" width="293.3333333333333" height="232" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(333.3 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7 5.5-5.5"/></g><g transform="translate(0.0 19.0)"><text x="74.0" y="16.5" font-size="16.5" fill="#1F2328" font-weight="700">Checked at compile</text><text x="74.0" y="39.5" font-size="16.5" fill="#1F2328" font-weight="700">time</text></g><text x="22.0" y="93.2" font-size="14" fill="#59636E"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">rustc</tspan> type-checks every binding</text><text x="22.0" y="115.2" font-size="14" fill="#59636E">and command argument. Unbound</text><text x="22.0" y="137.2" font-size="14" fill="#59636E">buttons, callbacks, controls</text><text x="22.0" y="159.2" font-size="14" fill="#59636E">writing engine state and</text><text x="22.0" y="181.2" font-size="14" fill="#59636E">missing translations do not</text><text x="22.0" y="203.2" font-size="14" fill="#59636E">compile.</text></g>
<rect x="642.6666666666666" y="24" width="293.3333333333333" height="232" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(642.7 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5"/></g><g transform="translate(0.0 19.0)"><text x="74.0" y="16.5" font-size="16.5" fill="#1F2328" font-weight="700">Your logic stays in</text><text x="74.0" y="39.5" font-size="16.5" fill="#1F2328" font-weight="700">Rust</text></g><text x="22.0" y="93.2" font-size="14" fill="#59636E">The engine is ordinary Rust with</text><text x="22.0" y="115.2" font-size="14" fill="#59636E">no UI dependency, tested without</text><text x="22.0" y="137.2" font-size="14" fill="#59636E">any window. It runs in the app</text><text x="22.0" y="159.2" font-size="14" fill="#59636E">process on the desktop and as</text><text x="22.0" y="181.2" font-size="14" fill="#59636E">WebAssembly in the browser.</text></g>
<rect x="24.0" y="272" width="293.3333333333333" height="254" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(24.0 272.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.8" ry="9"/><path d="M3 12h18"/></g><g transform="translate(0.0 19.0)"><text x="74.0" y="16.5" font-size="16.5" fill="#1F2328" font-weight="700">Localized from day</text><text x="74.0" y="39.5" font-size="16.5" fill="#1F2328" font-weight="700">one</text></g><text x="22.0" y="93.2" font-size="14" fill="#59636E"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">tr!</tspan> keeps every language next to</text><text x="22.0" y="115.2" font-size="14" fill="#59636E">the UI it belongs to. Strict</text><text x="22.0" y="137.2" font-size="14" fill="#59636E">builds reject missing</text><text x="22.0" y="159.2" font-size="14" fill="#59636E">translations, and the interface</text><text x="22.0" y="181.2" font-size="14" fill="#59636E">language switches at runtime</text><text x="22.0" y="203.2" font-size="14" fill="#59636E">without losing drafts.</text></g>
<rect x="333.3333333333333" y="272" width="293.3333333333333" height="254" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(333.3 272.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></g><g transform="translate(0.0 19.0)"><text x="74.0" y="16.5" font-size="16.5" fill="#1F2328" font-weight="700">Dark mode, zero</text><text x="74.0" y="39.5" font-size="16.5" fill="#1F2328" font-weight="700">setup</text></g><text x="22.0" y="93.2" font-size="14" fill="#59636E">Colors come from the platform</text><text x="22.0" y="115.2" font-size="14" fill="#59636E">theme: dark mode, accent colors</text><text x="22.0" y="137.2" font-size="14" fill="#59636E">and high contrast follow the</text><text x="22.0" y="159.2" font-size="14" fill="#59636E">system, and a declared brand</text><text x="22.0" y="181.2" font-size="14" fill="#59636E">color becomes the system accent.</text><text x="22.0" y="203.2" font-size="14" fill="#59636E">On the web Bern's theme kernel</text><text x="22.0" y="225.2" font-size="14" fill="#59636E">generates the whole palette.</text></g>
<rect x="642.6666666666666" y="272" width="293.3333333333333" height="254" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(642.7 272.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><rect x="3" y="8.5" width="13" height="11" rx="2.5"/><path d="M8 8.5V7a2.5 2.5 0 0 1 2.5-2.5h8A2.5 2.5 0 0 1 21 7v6a2.5 2.5 0 0 1-2.5 2.5H16"/></g><g transform="translate(0.0 19.0)"><text x="74.0" y="16.5" font-size="16.5" fill="#1F2328" font-weight="700">Declarative</text><text x="74.0" y="39.5" font-size="16.5" fill="#1F2328" font-weight="700">multi-window</text></g><text x="22.0" y="93.2" font-size="14" fill="#59636E">Each window has its own drafts,</text><text x="22.0" y="115.2" font-size="14" fill="#59636E">close check and save command;</text><text x="22.0" y="137.2" font-size="14" fill="#59636E">minimize, maximize, move and</text><text x="22.0" y="159.2" font-size="14" fill="#59636E">resize are commands answered</text><text x="22.0" y="181.2" font-size="14" fill="#59636E">with the platform's actual</text><text x="22.0" y="203.2" font-size="14" fill="#59636E">state.</text></g>
</svg>
