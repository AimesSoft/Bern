<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 323" width="960" height="323" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<g transform="translate(0.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18"/></g><text x="0.0" y="60.4" font-size="18" fill="#1F2328" font-weight="700">編譯成真正的原生介面</text><text x="0.0" y="93.3" font-size="14.5" fill="#1F2328">用 Rust 寫一套介面，建置時直接產生</text><text x="0.0" y="115.3" font-size="14.5" fill="#1F2328">SwiftUI、WinUI 3、GTK 4、Compose、</text><text x="0.0" y="137.3" font-size="14.5" fill="#1F2328">GPUI 與 Web 程式碼。</text><g transform="translate(0.0 157.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="169.2" font-size="14" fill="#1F2328">系統目標即平台原生控制項，預設無</text><text x="22.0" y="191.2" font-size="14" fill="#1F2328">WebView</text><g transform="translate(0.0 203.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="215.2" font-size="14" fill="#1F2328">外觀、深淺色、輸入法與無障礙跟隨系統</text><g transform="translate(0.0 227.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="239.2" font-size="14" fill="#1F2328">需要統一 GPU 繪製時一鍵切換 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">ui</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">=</tspan></text><text x="22.0" y="261.2" font-size="14" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">"gpui"</tspan></text><text x="0.0" y="293.6" font-size="13" fill="#59636E">不同於網頁套殼或全自繪引擎：不隨附瀏覽器，也</text><text x="0.0" y="313.1" font-size="13" fill="#59636E">不必按平台手寫 Swift / C++ / Kotlin 膠水。</text></g>
<g transform="translate(336.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5"/></g><text x="0.0" y="60.4" font-size="18" fill="#1F2328" font-weight="700">全 Rust 開發，邏輯與介面分離</text><text x="0.0" y="93.3" font-size="14.5" fill="#1F2328">協定定義狀態與命令，引擎寫純 Rust 業</text><text x="0.0" y="115.3" font-size="14.5" fill="#1F2328">務，介面以 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.3" fill="#0550AE">ui!</tspan> 宣告。</text><g transform="translate(0.0 135.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="147.2" font-size="14" fill="#1F2328">業務層不依賴 UI，直接用 tokio 等 Rust</text><text x="22.0" y="169.2" font-size="14" fill="#1F2328">生態並可獨立單測</text><g transform="translate(0.0 181.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="193.2" font-size="14" fill="#1F2328">漏翻譯、漏版面入口、錯綁定在編譯期報錯</text><g transform="translate(0.0 205.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="217.2" font-size="14" fill="#1F2328">所有操作皆命令：自動產生應用程式</text><text x="22.0" y="239.2" font-size="14" fill="#1F2328">CLI、<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">SKILL.md</tspan> 與可選 JS 介面</text><text x="0.0" y="271.6" font-size="13" fill="#59636E">既適合人寫，也天生適合 AI 寫程式、用應用：編</text><text x="0.0" y="291.1" font-size="13" fill="#59636E">譯期把關防漏，執行時以語意命令操作。</text></g>
<g transform="translate(672.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5z"/></g><text x="0.0" y="60.4" font-size="18" fill="#1F2328" font-weight="700">輕到不像跨平台</text><text x="0.0" y="93.2" font-size="14" fill="#1F2328">桌面端預設不帶瀏覽器核心與 JS 引擎，Rust</text><text x="0.0" y="115.2" font-size="14" fill="#1F2328">商業引擎編譯成原生程式碼，直接於應用程式</text><text x="0.0" y="137.2" font-size="14" fill="#1F2328">行程內執行。</text><text x="74.0" y="168" font-size="12" fill="#59636E">記憶體</text><text x="145.3" y="168" font-size="12" fill="#59636E">出現視窗</text><text x="216.7" y="168" font-size="12" fill="#59636E">大小</text><line x1="0" y1="178.0" x2="288.0" y2="178.0" stroke="#E6EAEF"/><text x="0" y="198.0" font-size="13" fill="#59636E">macOS</text><text x="74.0" y="198.0" font-size="14.5" font-weight="700" fill="#1F2328">39 MB</text><text x="145.3" y="198.0" font-size="14.5" font-weight="700" fill="#1F2328">0.4 秒</text><text x="216.7" y="198.0" font-size="14.5" font-weight="700" fill="#1F2328">2.7 MB</text><line x1="0" y1="208.0" x2="288.0" y2="208.0" stroke="#E6EAEF"/><text x="0" y="228.0" font-size="13" fill="#59636E">Windows</text><text x="74.0" y="228.0" font-size="14.5" font-weight="700" fill="#1F2328">35 MB</text><text x="145.3" y="228.0" font-size="14.5" font-weight="700" fill="#1F2328">0.3 秒</text><text x="216.7" y="228.0" font-size="14.5" font-weight="700" fill="#1F2328">4.2 MB</text><line x1="0" y1="238.0" x2="288.0" y2="238.0" stroke="#E6EAEF"/><text x="0" y="258.0" font-size="13" fill="#59636E">Web</text><text x="74.0" y="258.0" font-size="14.5" font-weight="400" fill="#AFB8C1">–</text><text x="145.3" y="258.0" font-size="14.5" font-weight="400" fill="#AFB8C1">–</text><text x="216.7" y="258.0" font-size="14.5" font-weight="700" fill="#1F2328">189 KB</text><text x="0.0" y="291.6" font-size="13" fill="#59636E">release 版展示應用程式實測。Windows 不需要</text><text x="0.0" y="311.1" font-size="13" fill="#59636E">.NET；Web 為 gzip 後，含 Rust 引擎。</text></g>
</svg>
