<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 626" width="960" height="626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
