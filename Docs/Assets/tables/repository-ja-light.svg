<text x="0.0" y="27.9" font-size="13" fill="#4A8BEF" font-weight="700">コア</text>
<text x="132.0" y="28.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern</tspan></text>
<text x="520.0" y="28.1" font-size="13.5" fill="#59636E">アプリが使うファサードクレート：マクロ、値、メディア、リソース</text>
<text x="132.0" y="54.0" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-macros</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">bern-syntax</tspan></text>
<text x="520.0" y="54.0" font-size="13.5" fill="#59636E"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">#[component]</tspan>、<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">ui!</tspan>、<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">tr!</tspan> と制約付きの宣言構文</text>
<text x="132.0" y="80.0" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-compiler</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">bern-ir</tspan></text>
<text x="520.0" y="80.0" font-size="13.5" fill="#59636E">宣言を共通 IR に読み込み、検査を行う</text>
<line x1="0" y1="100.0" x2="960" y2="100.0" stroke="#D0D7DE"/>
<text x="0.0" y="127.9" font-size="13" fill="#4A8BEF" font-weight="700">ランタイム</text>
<text x="132.0" y="128.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-protocol</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">bern-command</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">bern-runtime</tspan></text>
<text x="520.0" y="128.1" font-size="13.5" fill="#59636E">コマンドカタログ、エンジンホスト、UI セッションランタイム</text>
<text x="132.0" y="154.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-ffi</tspan></text>
<text x="520.0" y="154.1" font-size="13.5" fill="#59636E">ネイティブフロントエンドが呼ぶプロセス内 C インターフェース</text>
<text x="132.0" y="180.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-transport-ipc</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">-ws</tspan></text>
<text x="520.0" y="180.1" font-size="13.5" fill="#59636E">ローカル制御チャネルと WebSocket 通信</text>
<line x1="0" y1="200.0" x2="960" y2="200.0" stroke="#D0D7DE"/>
<text x="0.0" y="227.9" font-size="13" fill="#4A8BEF" font-weight="700">ターゲット</text>
<text x="132.0" y="228.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-backend-swiftui</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">-winui3</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">-gtk</tspan> ·</text>
<text x="132.0" y="248.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">-compose</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">-web</tspan></text>
<text x="520.0" y="228.1" font-size="13.5" fill="#59636E">ターゲットモジュール：ジェネレーターとそのランタイム</text>
<text x="132.0" y="274.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-gtk</tspan></text>
<text x="520.0" y="274.1" font-size="13.5" fill="#59636E">GTK ランタイム。生成された Linux アプリの中でだけコンパイルされ</text>
<text x="520.0" y="294.1" font-size="13.5" fill="#59636E">る</text>
<text x="132.0" y="320.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-theme</tspan></text>
<text x="520.0" y="320.1" font-size="13.5" fill="#59636E">ネイティブのテーマを持たないターゲット向けの Bern 配色アルゴリズ</text>
<text x="520.0" y="340.1" font-size="13.5" fill="#59636E">ム</text>
<line x1="0" y1="360.0" x2="960" y2="360.0" stroke="#D0D7DE"/>
<text x="0.0" y="387.9" font-size="13" fill="#4A8BEF" font-weight="700">入口とツール</text>
<text x="132.0" y="388.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-adapter-cli</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">-mcp</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">-json</tspan></text>
<text x="520.0" y="388.1" font-size="13.5" fill="#59636E">コマンドカタログから派生する入口</text>
<text x="132.0" y="414.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-cli</tspan></text>
<text x="520.0" y="414.1" font-size="13.5" fill="#59636E">ビルドツール <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">bern</tspan>：作成、チェック、ビルド、実行、環境の確認</text>
<line x1="0" y1="434.0" x2="960" y2="434.0" stroke="#D0D7DE"/>
<text x="0.0" y="461.9" font-size="13" fill="#4A8BEF" font-weight="700">サンプルと文書</text>
<text x="132.0" y="462.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">examples/showcase</tspan></text>
<text x="520.0" y="462.1" font-size="13.5" fill="#59636E">各プラットフォームで使うコントロールのショーケース</text>
<text x="132.0" y="488.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">examples/hello</tspan></text>
<text x="520.0" y="488.1" font-size="13.5" fill="#59636E">最小のアプリ：ウィンドウ一つ、一行の文字</text>
<text x="132.0" y="514.0" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">examples/planner</tspan></text>
<text x="520.0" y="514.0" font-size="13.5" fill="#59636E">モジュール化アプリ：シェルと 2 つのモジュール。スタイルの上書き、</text>
<text x="520.0" y="534.0" font-size="13.5" fill="#59636E">モーション、<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">Canvas</tspan> を使います</text>
<text x="132.0" y="560.0" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">examples/gallery</tspan></text>
<text x="520.0" y="560.0" font-size="13.5" fill="#59636E">パターン集：メディアアプリ向けのコンポーネント。時間差の登場、比</text>
<text x="520.0" y="580.0" font-size="13.5" fill="#59636E">率での配置、ポップオーバーボタン、4 段階のサイズ</text>
<text x="132.0" y="606.0" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">Docs/</tspan></text>
<text x="520.0" y="606.0" font-size="13.5" fill="#59636E">設計ドキュメント、プラットフォーム適応仕様、実装記録</text>
