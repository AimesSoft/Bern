<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 354" width="960" height="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<g transform="translate(0.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="m7.5 10 3 2.5-3 2.5M13 15h3.5"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">Every action is a command</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1">A button cannot hold an arbitrary</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">callback. It binds to a command in one</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">typed catalog, with parameters,</text><text x="0.0" y="115.2" font-size="14" fill="#9198A1">errors and retry policy shared by the</text><text x="0.0" y="137.2" font-size="14" fill="#9198A1">UI, the command line, JSON and MCP.</text></g>
<g transform="translate(336.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7 5.5-5.5"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">Checked at compile time</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">rustc</tspan> type-checks every binding and</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">command argument. Unbound buttons,</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">callbacks, controls writing engine</text><text x="0.0" y="115.2" font-size="14" fill="#9198A1">state and missing translations do</text><text x="0.0" y="137.2" font-size="14" fill="#9198A1">not compile.</text></g>
<g transform="translate(672.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">Your logic stays in Rust</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1">The engine is ordinary Rust with no</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">UI dependency, tested without any</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">window. It runs in the app process on</text><text x="0.0" y="115.2" font-size="14" fill="#9198A1">the desktop and as WebAssembly in the</text><text x="0.0" y="137.2" font-size="14" fill="#9198A1">browser.</text></g>
<g transform="translate(0.0 184.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.8" ry="9"/><path d="M3 12h18"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">Localized from day one</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">tr!</tspan> keeps every language next to the</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">UI it belongs to. Strict builds</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">reject missing translations, and the</text><text x="0.0" y="115.2" font-size="14" fill="#9198A1">interface language switches at</text><text x="0.0" y="137.2" font-size="14" fill="#9198A1">runtime without losing drafts.</text></g>
<g transform="translate(336.0 184.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">Dark mode, zero setup</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1">Colors come from the platform theme:</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">dark mode, accent colors and high</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">contrast follow the system, and a</text><text x="0.0" y="115.2" font-size="14" fill="#9198A1">declared brand color becomes the</text><text x="0.0" y="137.2" font-size="14" fill="#9198A1">system accent. On the web Bern's theme</text><text x="0.0" y="159.2" font-size="14" fill="#9198A1">kernel generates the whole palette.</text></g>
<g transform="translate(672.0 184.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><rect x="3" y="8.5" width="13" height="11" rx="2.5"/><path d="M8 8.5V7a2.5 2.5 0 0 1 2.5-2.5h8A2.5 2.5 0 0 1 21 7v6a2.5 2.5 0 0 1-2.5 2.5H16"/></g><text x="34.0" y="18.1" font-size="17" fill="#F0F6FC" font-weight="700">Declarative multi-window</text><text x="0.0" y="49.2" font-size="14" fill="#9198A1">Each window has its own drafts, close</text><text x="0.0" y="71.2" font-size="14" fill="#9198A1">check and save command; minimize,</text><text x="0.0" y="93.2" font-size="14" fill="#9198A1">maximize, move and resize are</text><text x="0.0" y="115.2" font-size="14" fill="#9198A1">commands answered with the</text><text x="0.0" y="137.2" font-size="14" fill="#9198A1">platform's actual state.</text></g>
</svg>
