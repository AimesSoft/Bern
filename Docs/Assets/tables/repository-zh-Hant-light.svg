<text x="0.0" y="27.9" font-size="13" fill="#4A8BEF" font-weight="700">核心</text>
<text x="132.0" y="28.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern</tspan></text>
