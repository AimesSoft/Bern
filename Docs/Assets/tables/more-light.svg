<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 244" width="960" height="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<g transform="translate(0.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="m7.5 10 3 2.5-3 2.5M13 15h3.5"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">每个操作都是命令</text><text x="0.0" y="49.2" font-size="14" fill="#59636E">按钮不能挂任意回调，只能绑定命令目录中的</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">一条类型化命令；参数、错误与重试策略由界</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">面、命令行、JSON 与 MCP 共用。</text></g>
<g transform="translate(336.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7 5.5-5.5"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">编译期就做检查</text><text x="0.0" y="49.2" font-size="14" fill="#59636E"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">rustc</tspan> 检查每个绑定与命令参数的类型。没有</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">绑定命令的按钮、任意回调、让控件直接写引</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">擎状态、缺少翻译，都无法通过编译。</text></g>
<g transform="translate(672.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">业务逻辑留在 Rust</text><text x="0.0" y="49.2" font-size="14" fill="#59636E">引擎是不依赖任何 UI 的普通 Rust 代码，不</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">开窗口也能测试。在桌面上运行在应用进程</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">内，在浏览器中编译为 WebAssembly。</text></g>
<g transform="translate(0.0 140.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.8" ry="9"/><path d="M3 12h18"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">从第一天起就本地化</text><text x="0.0" y="49.2" font-size="14" fill="#59636E"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">tr!</tspan> 让各语言文案紧挨着它所属的界面。严格</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">模式的构建会拒绝缺失的翻译；运行中切换界</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">面语言不会丢失草稿。</text></g>
<g transform="translate(336.0 140.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">深浅色零配置</text><text x="0.0" y="49.2" font-size="14" fill="#59636E">颜色来自平台主题：深浅色、强调色、高对比</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">跟随系统，声明的品牌色映射为系统强调色。</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">Web 由 Bern 的主题内核生成整套配色。</text></g>
<g transform="translate(672.0 140.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><rect x="3" y="8.5" width="13" height="11" rx="2.5"/><path d="M8 8.5V7a2.5 2.5 0 0 1 2.5-2.5h8A2.5 2.5 0 0 1 21 7v6a2.5 2.5 0 0 1-2.5 2.5H16"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">声明式多窗口</text><text x="0.0" y="49.2" font-size="14" fill="#59636E">每个窗口有自己的草稿、关闭检查与保存命</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">令；最小化、最大化、移动、调整尺寸也是命</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">令，以平台的实际状态答复。</text></g>
</svg>
