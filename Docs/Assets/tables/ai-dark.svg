<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" width="960" height="504" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<text x="0.0" y="16.0" font-size="13" font-weight="700" fill="#9198A1">漏掉了什么</text>
<text x="364.0" y="16.0" font-size="13" font-weight="700" fill="#9198A1">Bern 怎么处理</text>
<line x1="0" y1="30.0" x2="960" y2="30.0" stroke="#30363D"/>
<text x="0.0" y="64.0" font-size="15" fill="#F0F6FC" font-weight="600">某段文案少写了一种语言</text>
<g transform="translate(330.0 50.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<text x="364" y="65" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#FF7B72">error[B102]</text>
<text x="364.0" y="91.2" font-size="14" fill="#9198A1">各语言用 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">tr!</tspan> 写在同一处、紧挨着界面，漏写一眼可见；直接写死的字面量报 B103（严格模</text>
<text x="364.0" y="113.2" font-size="14" fill="#9198A1">式，默认开启）。</text>
<line x1="0" y1="138.0" x2="960" y2="138.0" stroke="#21262D"/>
<text x="0.0" y="172.0" font-size="15" fill="#F0F6FC" font-weight="600">功能在某个显示模式下没有界面入口</text>
<g transform="translate(330.0 158.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<text x="364" y="173" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#FF7B72">error[B201]</text>
<text x="364.0" y="199.2" font-size="14" fill="#9198A1">页面用功能契约声明它必须提供哪些功能，编译器逐个布局（<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">compact</tspan>、<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">expanded</tspan>）证明每个功</text>
<text x="364.0" y="221.2" font-size="14" fill="#9198A1">能都有入口，宽屏有、窄屏漏也不行。</text>
<line x1="0" y1="246.0" x2="960" y2="246.0" stroke="#21262D"/>
<text x="0.0" y="280.0" font-size="15" fill="#F0F6FC" font-weight="600">契约范围内的界面入口没有登记到功能</text>
<g transform="translate(330.0 266.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<text x="364" y="281" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#FF7B72">error[B202]</text>
<text x="364.0" y="307.2" font-size="14" fill="#9198A1">反过来同样不行：入口执行的命令不属于它绑定的功能，报 B204。</text>
<line x1="0" y1="332.0" x2="960" y2="332.0" stroke="#21262D"/>
<text x="0.0" y="366.0" font-size="15" fill="#F0F6FC" font-weight="600">入口只出现在条件分支里，证明不了总能用到</text>
<g transform="translate(330.0 352.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<text x="364" y="367" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#FF7B72">error[B203]</text>
<text x="364.0" y="393.2" font-size="14" fill="#9198A1">除非显式写明人工保证。</text>
<line x1="0" y1="418.0" x2="960" y2="418.0" stroke="#21262D"/>
<text x="0.0" y="452.0" font-size="15" fill="#F0F6FC" font-weight="600">想给按钮挂一段任意代码</text>
<g transform="translate(330.0 438.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<text x="364.0" y="453.0" font-size="14" font-weight="700" fill="#6EA2F5">写不出来</text>
<text x="364.0" y="479.2" font-size="14" fill="#9198A1">按钮只能绑定命令目录里的类型化命令，控件也不能直接改引擎状态。</text>
</svg>
