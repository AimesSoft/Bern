<text x="0.0" y="27.9" font-size="13" fill="#6EA2F5" font-weight="700">Core</text>
<text x="132.0" y="28.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern</tspan></text>
<text x="520.0" y="28.1" font-size="13.5" fill="#9198A1">The facade crate applications use: macros, values, media,</text>
<text x="520.0" y="48.0" font-size="13.5" fill="#9198A1">resources</text>
<text x="132.0" y="74.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-macros</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">bern-syntax</tspan></text>
<text x="520.0" y="74.0" font-size="13.5" fill="#9198A1"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">#[component]</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">ui!</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">tr!</tspan> and the restricted declaration</text>
<text x="520.0" y="94.0" font-size="13.5" fill="#9198A1">syntax</text>
<text x="132.0" y="120.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-compiler</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">bern-ir</tspan></text>
<text x="520.0" y="120.0" font-size="13.5" fill="#9198A1">Reads declarations into the shared IR and runs the checks</text>
<line x1="0" y1="140.0" x2="960" y2="140.0" stroke="#30363D"/>
<text x="0.0" y="167.9" font-size="13" fill="#6EA2F5" font-weight="700">Runtime</text>
<text x="132.0" y="168.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-protocol</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">bern-command</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">bern-runtime</tspan></text>
<text x="520.0" y="168.1" font-size="13.5" fill="#9198A1">Command catalog, engine host and UI session runtime</text>
<text x="132.0" y="194.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-ffi</tspan></text>
<text x="520.0" y="194.1" font-size="13.5" fill="#9198A1">The in-process C interface native front ends call</text>
<text x="132.0" y="220.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-transport-ipc</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-ws</tspan></text>
<text x="520.0" y="220.1" font-size="13.5" fill="#9198A1">Local control channel and WebSocket transport</text>
<line x1="0" y1="240.0" x2="960" y2="240.0" stroke="#30363D"/>
<text x="0.0" y="267.9" font-size="13" fill="#6EA2F5" font-weight="700">Targets</text>
<text x="132.0" y="268.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-backend-swiftui</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-winui3</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-gtk</tspan> ·</text>
<text x="132.0" y="288.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-compose</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-web</tspan></text>
<text x="520.0" y="268.1" font-size="13.5" fill="#9198A1">Target modules: generators and their runtimes</text>
<text x="132.0" y="314.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-gtk</tspan></text>
<text x="520.0" y="314.1" font-size="13.5" fill="#9198A1">GTK runtime, compiled only inside generated Linux apps</text>
<text x="132.0" y="340.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-theme</tspan></text>
<text x="520.0" y="340.1" font-size="13.5" fill="#9198A1">Bern's color algorithm for targets without a native theme</text>
<line x1="0" y1="360.0" x2="960" y2="360.0" stroke="#30363D"/>
<text x="0.0" y="387.9" font-size="13" fill="#6EA2F5" font-weight="700">Entries and</text>
<text x="0.0" y="407.9" font-size="13" fill="#6EA2F5" font-weight="700">tools</text>
<text x="132.0" y="388.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-adapter-cli</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-mcp</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-json</tspan></text>
<text x="520.0" y="388.1" font-size="13.5" fill="#9198A1">Entries derived from the command catalog</text>
<text x="132.0" y="414.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-cli</tspan></text>
<text x="520.0" y="414.1" font-size="13.5" fill="#9198A1">The build tool <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">bern</tspan>: create, check, build, run and check the</text>
<text x="520.0" y="434.1" font-size="13.5" fill="#9198A1">environment</text>
<line x1="0" y1="454.0" x2="960" y2="454.0" stroke="#30363D"/>
<text x="0.0" y="481.9" font-size="13" fill="#6EA2F5" font-weight="700">Examples and</text>
<text x="0.0" y="501.9" font-size="13" fill="#6EA2F5" font-weight="700">docs</text>
<text x="132.0" y="482.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">examples/showcase</tspan></text>
<text x="520.0" y="482.1" font-size="13.5" fill="#9198A1">The control showcase used on every platform</text>
<text x="132.0" y="508.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">examples/hello</tspan></text>
<text x="520.0" y="508.1" font-size="13.5" fill="#9198A1">The smallest app: one window, one line</text>
<text x="132.0" y="534.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">examples/planner</tspan></text>
<text x="520.0" y="534.0" font-size="13.5" fill="#9198A1">A modular app: a shell and two modules, with style</text>
<text x="520.0" y="554.0" font-size="13.5" fill="#9198A1">overrides, motion and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">Canvas</tspan></text>
<text x="132.0" y="580.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">Docs/</tspan></text>
<text x="520.0" y="580.0" font-size="13.5" fill="#9198A1">Design document, platform adaptation specs and</text>
<text x="520.0" y="600.0" font-size="13.5" fill="#9198A1">implementation notes</text>
</svg>
