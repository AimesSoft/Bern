<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 655" width="960" height="655" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#484F58"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6EA2F5"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="654" rx="20" fill="#0D1117" stroke="#30363D"/>
<text x="32" y="40" font-size="13" font-weight="600" fill="#9198A1">What was missed</text>
<text x="376" y="40" font-size="13" font-weight="600" fill="#9198A1">What Bern does</text>
<line x1="24" y1="56" x2="936" y2="56" stroke="#30363D"/>
<text x="32.0" y="90.0" font-size="15" fill="#F0F6FC" font-weight="600">A string misses a language</text>
<g transform="translate(336.0 76.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<rect x="376.0" y="74.0" width="102.5" height="23" rx="11.5" fill="#3B1C21"/><text x="427.2" y="90.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#FF7B72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">error[B102]</text>
<text x="376.0" y="120.2" font-size="14" fill="#9198A1">Every language sits in one <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">tr!</tspan> next to the UI, so a gap shows at a</text>
<text x="376.0" y="142.2" font-size="14" fill="#9198A1">glance; hard-coded literals are B103 (strict mode, on by default).</text>
<line x1="24" y1="167" x2="936" y2="167" stroke="#21262D"/>
<text x="32.0" y="201.0" font-size="15" fill="#F0F6FC" font-weight="600">A feature has no entry in some</text>
<text x="32.0" y="224.0" font-size="15" fill="#F0F6FC" font-weight="600">display mode</text>
<g transform="translate(336.0 187.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<rect x="376.0" y="185.0" width="102.5" height="23" rx="11.5" fill="#3B1C21"/><text x="427.2" y="201.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#FF7B72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">error[B201]</text>
<text x="376.0" y="231.2" font-size="14" fill="#9198A1">A page declares the features it must offer in a feature contract, and</text>
<text x="376.0" y="253.2" font-size="14" fill="#9198A1">the compiler proves an entry for each in every layout (<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">compact</tspan>,</text>
<text x="376.0" y="275.2" font-size="14" fill="#9198A1"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">expanded</tspan>); present on wide screens but missing on narrow ones fails</text>
<text x="376.0" y="297.2" font-size="14" fill="#9198A1">too.</text>
<line x1="24" y1="322" x2="936" y2="322" stroke="#21262D"/>
<text x="32.0" y="356.0" font-size="15" fill="#F0F6FC" font-weight="600">An entry inside a contract is not</text>
<text x="32.0" y="379.0" font-size="15" fill="#F0F6FC" font-weight="600">registered to a feature</text>
<g transform="translate(336.0 342.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<rect x="376.0" y="340.0" width="102.5" height="23" rx="11.5" fill="#3B1C21"/><text x="427.2" y="356.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#FF7B72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">error[B202]</text>
<text x="376.0" y="386.2" font-size="14" fill="#9198A1">The other way round fails as well: an entry that runs a command outside</text>
<text x="376.0" y="408.2" font-size="14" fill="#9198A1">its feature is B204.</text>
<line x1="24" y1="433" x2="936" y2="433" stroke="#21262D"/>
<text x="32.0" y="467.0" font-size="15" fill="#F0F6FC" font-weight="600">An entry appears only in a</text>
<text x="32.0" y="490.0" font-size="15" fill="#F0F6FC" font-weight="600">conditional branch and cannot be</text>
<text x="32.0" y="513.0" font-size="15" fill="#F0F6FC" font-weight="600">proven reachable</text>
<g transform="translate(336.0 453.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<rect x="376.0" y="451.0" width="102.5" height="23" rx="11.5" fill="#3B1C21"/><text x="427.2" y="467.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#FF7B72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">error[B203]</text>
<text x="376.0" y="497.2" font-size="14" fill="#9198A1">Unless a manual guarantee is written down.</text>
<line x1="24" y1="538" x2="936" y2="538" stroke="#21262D"/>
<text x="32.0" y="572.0" font-size="15" fill="#F0F6FC" font-weight="600">Hanging arbitrary code on a</text>
<text x="32.0" y="595.0" font-size="15" fill="#F0F6FC" font-weight="600">button</text>
<g transform="translate(336.0 558.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<rect x="376.0" y="556.0" width="146.5" height="23" rx="11.5" fill="#12273F"/><text x="449.3" y="572.0" font-size="12.5" font-weight="600" text-anchor="middle" fill="#58A6FF">Cannot be written</text>
<text x="376.0" y="602.2" font-size="14" fill="#9198A1">Buttons bind only typed commands from the catalog, and controls cannot</text>
<text x="376.0" y="624.2" font-size="14" fill="#9198A1">write engine state.</text>
</svg>
