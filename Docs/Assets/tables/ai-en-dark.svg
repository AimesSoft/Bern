<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 589" width="960" height="589" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<text x="0.0" y="16.0" font-size="13" font-weight="700" fill="#9198A1">What was missed</text>
<text x="364.0" y="16.0" font-size="13" font-weight="700" fill="#9198A1">What Bern does</text>
<line x1="0" y1="30.0" x2="960" y2="30.0" stroke="#30363D"/>
<text x="0.0" y="64.0" font-size="15" fill="#F0F6FC" font-weight="600">A string misses a language</text>
<g transform="translate(330.0 50.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<text x="364" y="65" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#FF7B72">error[B102]</text>
<text x="364.0" y="91.2" font-size="14" fill="#9198A1">Every language sits in one <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">tr!</tspan> next to the UI, so a gap shows at a glance;</text>
<text x="364.0" y="113.2" font-size="14" fill="#9198A1">hard-coded literals are B103 (strict mode, on by default).</text>
<line x1="0" y1="138.0" x2="960" y2="138.0" stroke="#21262D"/>
<text x="0.0" y="172.0" font-size="15" fill="#F0F6FC" font-weight="600">A feature has no entry in some</text>
<text x="0.0" y="195.0" font-size="15" fill="#F0F6FC" font-weight="600">display mode</text>
<g transform="translate(330.0 158.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<text x="364" y="173" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#FF7B72">error[B201]</text>
<text x="364.0" y="199.2" font-size="14" fill="#9198A1">A page declares the features it must offer in a feature contract, and the</text>
<text x="364.0" y="221.2" font-size="14" fill="#9198A1">compiler proves an entry for each in every layout (<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">compact</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">expanded</tspan>);</text>
<text x="364.0" y="243.2" font-size="14" fill="#9198A1">present on wide screens but missing on narrow ones fails too.</text>
<line x1="0" y1="268.0" x2="960" y2="268.0" stroke="#21262D"/>
<text x="0.0" y="302.0" font-size="15" fill="#F0F6FC" font-weight="600">An entry inside a contract is not</text>
<text x="0.0" y="325.0" font-size="15" fill="#F0F6FC" font-weight="600">registered to a feature</text>
<g transform="translate(330.0 288.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<text x="364" y="303" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#FF7B72">error[B202]</text>
<text x="364.0" y="329.2" font-size="14" fill="#9198A1">The other way round fails as well: an entry that runs a command outside its</text>
<text x="364.0" y="351.2" font-size="14" fill="#9198A1">feature is B204.</text>
<line x1="0" y1="376.0" x2="960" y2="376.0" stroke="#21262D"/>
<text x="0.0" y="410.0" font-size="15" fill="#F0F6FC" font-weight="600">An entry appears only in a</text>
<text x="0.0" y="433.0" font-size="15" fill="#F0F6FC" font-weight="600">conditional branch and cannot be</text>
<text x="0.0" y="456.0" font-size="15" fill="#F0F6FC" font-weight="600">proven reachable</text>
<g transform="translate(330.0 396.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<text x="364" y="411" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#FF7B72">error[B203]</text>
<text x="364.0" y="437.2" font-size="14" fill="#9198A1">Unless a manual guarantee is written down.</text>
<line x1="0" y1="481.0" x2="960" y2="481.0" stroke="#21262D"/>
<text x="0.0" y="515.0" font-size="15" fill="#F0F6FC" font-weight="600">Hanging arbitrary code on a button</text>
<g transform="translate(330.0 501.5) scale(0.7500)" fill="none" stroke="#484F58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#484F58"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></g>
<text x="364.0" y="516.0" font-size="14" font-weight="700" fill="#6EA2F5">Cannot be written</text>
<text x="364.0" y="542.2" font-size="14" fill="#9198A1">Buttons bind only typed commands from the catalog, and controls cannot write</text>
<text x="364.0" y="564.2" font-size="14" fill="#9198A1">engine state.</text>
</svg>
