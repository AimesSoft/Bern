<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 366" width="960" height="366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<g transform="translate(0.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">Compiled into native UI</text><text x="0.0" y="93.3" font-size="14.5" fill="#F0F6FC">Write UI once in Rust; Bern</text><text x="0.0" y="115.3" font-size="14.5" fill="#F0F6FC">generates SwiftUI, WinUI 3, GTK 4,</text><text x="0.0" y="137.3" font-size="14.5" fill="#F0F6FC">Compose, GPUI and Web code.</text><g transform="translate(0.0 157.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="169.2" font-size="14" fill="#F0F6FC">Real OS controls, zero WebView by</text><text x="22.0" y="191.2" font-size="14" fill="#F0F6FC">default</text><g transform="translate(0.0 203.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="215.2" font-size="14" fill="#F0F6FC">Look, dark mode, IME and a11y from</text><text x="22.0" y="237.2" font-size="14" fill="#F0F6FC">the OS</text><g transform="translate(0.0 249.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="261.2" font-size="14" fill="#F0F6FC">Switch to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">ui</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">=</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">"gpui"</tspan> for unified</text><text x="22.0" y="283.2" font-size="14" fill="#F0F6FC">GPU UI</text><text x="0.0" y="315.6" font-size="13" fill="#9198A1">Unlike WebView shells or self-drawn</text><text x="0.0" y="335.1" font-size="13" fill="#9198A1">toolkits: no browser engine and no</text><text x="0.0" y="354.6" font-size="13" fill="#9198A1">hand-written Swift, C++ or Kotlin glue.</text></g>
<g transform="translate(336.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">All Rust, clean separation</text><text x="0.0" y="93.3" font-size="14.5" fill="#F0F6FC">A protocol declares state and</text><text x="0.0" y="115.3" font-size="14.5" fill="#F0F6FC">commands; plain Rust runs the</text><text x="0.0" y="137.3" font-size="14.5" fill="#F0F6FC">engine; <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.3" fill="#79C0FF">ui!</tspan> declares views.</text><g transform="translate(0.0 157.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="169.2" font-size="14" fill="#F0F6FC">UI-free logic: any Rust crate,</text><text x="22.0" y="191.2" font-size="14" fill="#F0F6FC">plain <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">cargo</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">test</tspan></text><g transform="translate(0.0 203.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="215.2" font-size="14" fill="#F0F6FC">Missing translations and entries</text><text x="22.0" y="237.2" font-size="14" fill="#F0F6FC">fail to compile</text><g transform="translate(0.0 249.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="261.2" font-size="14" fill="#F0F6FC">Command-driven: ships app CLI and</text><text x="22.0" y="283.2" font-size="14" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">SKILL.md</tspan></text><text x="0.0" y="315.6" font-size="13" fill="#9198A1">Built for humans and AI alike: the</text><text x="0.0" y="335.1" font-size="13" fill="#9198A1">compiler catches omissions and agents</text><text x="0.0" y="354.6" font-size="13" fill="#9198A1">drive the app semantically.</text></g>
<g transform="translate(672.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5z"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">Too light to feel</text><text x="0.0" y="86.4" font-size="18" fill="#F0F6FC" font-weight="700">cross-platform</text><text x="0.0" y="119.2" font-size="14" fill="#F0F6FC">No browser or JS engine on the</text><text x="0.0" y="141.2" font-size="14" fill="#F0F6FC">desktop by default; the Rust engine</text><text x="0.0" y="163.2" font-size="14" fill="#F0F6FC">compiles to native code in process.</text><text x="74.0" y="194" font-size="12" fill="#9198A1">Memory</text><text x="145.3" y="194" font-size="12" fill="#9198A1">Window</text><text x="216.7" y="194" font-size="12" fill="#9198A1">Size</text><line x1="0" y1="204.0" x2="288.0" y2="204.0" stroke="#21262D"/><text x="0" y="224.0" font-size="13" fill="#9198A1">macOS</text><text x="74.0" y="224.0" font-size="14.5" font-weight="700" fill="#F0F6FC">39 MB</text><text x="145.3" y="224.0" font-size="14.5" font-weight="700" fill="#F0F6FC">0.4 s</text><text x="216.7" y="224.0" font-size="14.5" font-weight="700" fill="#F0F6FC">2.7 MB</text><line x1="0" y1="234.0" x2="288.0" y2="234.0" stroke="#21262D"/><text x="0" y="254.0" font-size="13" fill="#9198A1">Windows</text><text x="74.0" y="254.0" font-size="14.5" font-weight="700" fill="#F0F6FC">35 MB</text><text x="145.3" y="254.0" font-size="14.5" font-weight="700" fill="#F0F6FC">0.3 s</text><text x="216.7" y="254.0" font-size="14.5" font-weight="700" fill="#F0F6FC">4.2 MB</text><line x1="0" y1="264.0" x2="288.0" y2="264.0" stroke="#21262D"/><text x="0" y="284.0" font-size="13" fill="#9198A1">Web</text><text x="74.0" y="284.0" font-size="14.5" font-weight="400" fill="#484F58">–</text><text x="145.3" y="284.0" font-size="14.5" font-weight="400" fill="#484F58">–</text><text x="216.7" y="284.0" font-size="14.5" font-weight="700" fill="#F0F6FC">189 KB</text><text x="0.0" y="317.6" font-size="13" fill="#9198A1">Measured on the release showcase. No</text><text x="0.0" y="337.1" font-size="13" fill="#9198A1">.NET on Windows; the web figure is</text><text x="0.0" y="356.6" font-size="13" fill="#9198A1">gzipped and includes the Rust engine.</text></g>
</svg>
