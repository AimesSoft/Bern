<text x="0.0" y="433.9" font-size="13" fill="#4A8BEF" font-weight="700">Entries and</text>
<text x="0.0" y="453.9" font-size="13" fill="#4A8BEF" font-weight="700">tools</text>
<text x="132.0" y="434.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-adapter-cli</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">-json</tspan></text>
