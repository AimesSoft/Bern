<text x="0.0" y="27.9" font-size="13" fill="#4A8BEF" font-weight="700">Core</text>
<text x="132.0" y="28.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern</tspan></text>
<text x="520.0" y="28.1" font-size="13.5" fill="#59636E">The facade crate applications use: macros, values, media,</text>
<text x="520.0" y="48.0" font-size="13.5" fill="#59636E">resources</text>
<text x="132.0" y="74.0" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-macros</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">bern-syntax</tspan></text>
<text x="520.0" y="74.0" font-size="13.5" fill="#59636E"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">#[component]</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">ui!</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">tr!</tspan> and the restricted declaration</text>
<text x="520.0" y="94.0" font-size="13.5" fill="#59636E">syntax</text>
<text x="132.0" y="120.0" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-compiler</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">bern-ir</tspan></text>
<text x="520.0" y="120.0" font-size="13.5" fill="#59636E">Reads declarations into the shared IR and runs the checks</text>
<line x1="0" y1="140.0" x2="960" y2="140.0" stroke="#D0D7DE"/>
<text x="0.0" y="167.9" font-size="13" fill="#4A8BEF" font-weight="700">Runtime</text>
