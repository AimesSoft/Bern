<text x="132.0" y="460.1" font-size="13.5" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">crates/bern-cli</tspan></text>
<text x="520.0" y="460.1" font-size="13.5" fill="#59636E">The build tool <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#0550AE">bern</tspan>: create, check, build, run, package and</text>
<text x="520.0" y="480.1" font-size="13.5" fill="#59636E">doctor</text>
