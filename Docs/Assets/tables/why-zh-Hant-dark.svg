<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 299" width="960" height="299" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<g transform="translate(0.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">編譯成原生介面</text><text x="0.0" y="93.3" font-size="14.5" fill="#F0F6FC">一份 Rust 宣告，編譯成 SwiftUI、WinUI</text><text x="0.0" y="115.3" font-size="14.5" fill="#F0F6FC">3、GTK 4、Jetpack Compose 與 Web。</text><g transform="translate(0.0 135.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="147.2" font-size="14" fill="#F0F6FC">建置時產生各平台自己的 UI 程式碼</text><g transform="translate(0.0 159.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="171.2" font-size="14" fill="#F0F6FC">執行時沒有 JS 引擎，沒有虛擬 DOM</text><g transform="translate(0.0 183.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="195.2" font-size="14" fill="#F0F6FC">介面就是系統控制項本身</text><text x="0.0" y="227.7" font-size="13" fill="#9198A1">目標與 React Native 相近，做法不同：React</text><text x="0.0" y="247.2" font-size="13" fill="#9198A1">Native 在執行時以 JS 引擎協調原生視圖。</text></g>
<g transform="translate(336.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M11 3.5c.6 4.3 3.2 6.9 7.5 7.5-4.3.6-6.9 3.2-7.5 7.5-.6-4.3-3.2-6.9-7.5-7.5 4.3-.6 6.9-3.2 7.5-7.5z"/><path d="M19 15.5v5M16.5 18h5"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">為 AI 而建：寫得對，用得上</text><text x="0.0" y="91.0" font-size="12.5" font-weight="700" fill="#6EA2F5">AI 寫程式</text><text x="0.0" y="115.2" font-size="14" fill="#F0F6FC">漏掉的翻譯、漏掉的介面入口、沒登記的按</text><text x="0.0" y="137.2" font-size="14" fill="#F0F6FC">鈕、沒命令化的操作，都是編譯錯誤，並指向</text><text x="0.0" y="159.2" font-size="14" fill="#F0F6FC">具體的檔案與行。</text><text x="0.0" y="189.0" font-size="12.5" font-weight="700" fill="#6EA2F5">AI 使用應用程式</text><text x="0.0" y="213.2" font-size="14" fill="#F0F6FC">每個按鈕都是 MCP 工具：讀的是控制項的語</text><text x="0.0" y="235.2" font-size="14" fill="#F0F6FC">意，走與滑鼠點擊相同的程式碼路徑，不靠截</text><text x="0.0" y="257.2" font-size="14" fill="#F0F6FC">圖，不靠座標。</text></g>
<g transform="translate(672.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5z"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">輕到不像跨平台</text><text x="0.0" y="93.2" font-size="14" fill="#F0F6FC">桌面上不帶瀏覽器核心與 JS 引擎，商業引擎</text><text x="0.0" y="115.2" font-size="14" fill="#F0F6FC">編譯成原生程式碼，在應用程式行程內執行。</text><text x="74.0" y="146" font-size="12" fill="#9198A1">記憶體</text><text x="145.3" y="146" font-size="12" fill="#9198A1">出現視窗</text><text x="216.7" y="146" font-size="12" fill="#9198A1">大小</text><line x1="0" y1="156.0" x2="288.0" y2="156.0" stroke="#21262D"/><text x="0" y="176.0" font-size="13" fill="#9198A1">macOS</text><text x="74.0" y="176.0" font-size="14.5" font-weight="700" fill="#F0F6FC">39 MB</text><text x="145.3" y="176.0" font-size="14.5" font-weight="700" fill="#F0F6FC">0.4 秒</text><text x="216.7" y="176.0" font-size="14.5" font-weight="700" fill="#F0F6FC">2.7 MB</text><line x1="0" y1="186.0" x2="288.0" y2="186.0" stroke="#21262D"/><text x="0" y="206.0" font-size="13" fill="#9198A1">Windows</text><text x="74.0" y="206.0" font-size="14.5" font-weight="700" fill="#F0F6FC">35 MB</text><text x="145.3" y="206.0" font-size="14.5" font-weight="700" fill="#F0F6FC">0.3 秒</text><text x="216.7" y="206.0" font-size="14.5" font-weight="700" fill="#F0F6FC">4.2 MB</text><line x1="0" y1="216.0" x2="288.0" y2="216.0" stroke="#21262D"/><text x="0" y="236.0" font-size="13" fill="#9198A1">Web</text><text x="74.0" y="236.0" font-size="14.5" font-weight="400" fill="#484F58">–</text><text x="145.3" y="236.0" font-size="14.5" font-weight="400" fill="#484F58">–</text><text x="216.7" y="236.0" font-size="14.5" font-weight="700" fill="#F0F6FC">189 KB</text><text x="0.0" y="269.6" font-size="13" fill="#9198A1">release 版展示應用程式實測。Windows 不需要</text><text x="0.0" y="289.1" font-size="13" fill="#9198A1">.NET；Web 為 gzip 後，含 Rust 引擎。</text></g>
</svg>
