<rect x="0.5" y="0.5" width="959" height="781" rx="20" fill="#0D1117" stroke="#30363D"/>
<text x="32.0" y="47.9" font-size="13" fill="#6EA2F5" font-weight="700">コア</text>
<text x="168.0" y="48.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern</tspan></text>
<text x="548.0" y="48.0" font-size="13.5" fill="#9198A1">アプリが使うファサードクレート：マクロ、値、メディア、リ</text>
<text x="548.0" y="68.0" font-size="13.5" fill="#9198A1">ソース</text>
<text x="168.0" y="100.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-macros</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">bern-syntax</tspan></text>
<text x="548.0" y="100.0" font-size="13.5" fill="#9198A1"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">#[component]</tspan>、<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">ui!</tspan>、<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">tr!</tspan> と制約付きの宣言構文</text>
<text x="168.0" y="132.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-compiler</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">bern-ir</tspan></text>
<text x="548.0" y="132.1" font-size="13.5" fill="#9198A1">宣言を共通 IR に読み込み、検査を行う</text>
