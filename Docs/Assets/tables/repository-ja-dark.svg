<text x="548.0" y="188.1" font-size="13.5" fill="#9198A1">コマンドカタログ、エンジンホスト、UI セッションランタイ</text>
<text x="548.0" y="208.1" font-size="13.5" fill="#9198A1">ム</text>
<text x="168.0" y="240.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-ffi</tspan></text>
<text x="548.0" y="240.1" font-size="13.5" fill="#9198A1">ネイティブフロントエンドが呼ぶプロセス内 C インターフェー</text>
<text x="548.0" y="260.1" font-size="13.5" fill="#9198A1">ス</text>
<text x="168.0" y="292.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-transport-ipc</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-ws</tspan></text>
<text x="548.0" y="292.1" font-size="13.5" fill="#9198A1">ローカル制御チャネルと WebSocket 通信</text>
