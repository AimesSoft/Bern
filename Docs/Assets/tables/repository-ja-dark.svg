<text x="168.0" y="368.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-compose</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-web</tspan></text>
<text x="548.0" y="348.1" font-size="13.5" fill="#9198A1">ターゲットモジュール：ジェネレーターとそのランタイム</text>
<text x="168.0" y="400.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-gtk</tspan></text>
<text x="548.0" y="400.1" font-size="13.5" fill="#9198A1">GTK ランタイム。生成された Linux アプリの中でだけコンパ</text>
<text x="548.0" y="420.1" font-size="13.5" fill="#9198A1">イルされる</text>
<text x="168.0" y="452.1" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-theme</tspan></text>
<text x="548.0" y="452.1" font-size="13.5" fill="#9198A1">ネイティブのテーマを持たないターゲット向けの Bern 配色ア</text>
<text x="548.0" y="472.1" font-size="13.5" fill="#9198A1">ルゴリズム</text>
<line x1="24" y1="496" x2="936" y2="496" stroke="#30363D"/>
<text x="32.0" y="527.9" font-size="13" fill="#6EA2F5" font-weight="700">入口とツール</text>
<text x="168.0" y="528.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-adapter-cli</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-mcp</tspan> · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">-json</tspan></text>
<text x="548.0" y="528.0" font-size="13.5" fill="#9198A1">コマンドカタログから派生する入口</text>
<text x="168.0" y="560.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">crates/bern-cli</tspan></text>
<text x="548.0" y="560.0" font-size="13.5" fill="#9198A1">ビルドツール <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">bern</tspan>：作成、チェック、ビルド、実行、環境の</text>
<text x="548.0" y="580.0" font-size="13.5" fill="#9198A1">確認</text>
