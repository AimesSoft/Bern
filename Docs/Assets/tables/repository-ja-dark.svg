<text x="168.0" y="636.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">examples/showcase</tspan></text>
<text x="548.0" y="636.0" font-size="13.5" fill="#9198A1">各プラットフォームで使うコントロールのショーケース</text>
<text x="168.0" y="668.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">examples/hello</tspan></text>
<text x="548.0" y="668.0" font-size="13.5" fill="#9198A1">最小のアプリ：ウィンドウ一つ、一行の文字</text>
<text x="168.0" y="700.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">examples/planner</tspan></text>
<text x="548.0" y="700.0" font-size="13.5" fill="#9198A1">モジュール化アプリ：シェルと 2 つのモジュール。スタイルの</text>
<text x="548.0" y="720.0" font-size="13.5" fill="#9198A1">上書き、モーション、<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">Canvas</tspan> を使います</text>
<text x="168.0" y="752.0" font-size="13.5" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.4" fill="#79C0FF">Docs/</tspan></text>
<text x="548.0" y="752.0" font-size="13.5" fill="#9198A1">設計ドキュメント、プラットフォーム適応仕様、実装記録</text>
