<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 354" width="960" height="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<g transform="translate(0.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="m7.5 10 3 2.5-3 2.5M13 15h3.5"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">すべての操作はコマンド</text><text x="0.0" y="49.2" font-size="14" fill="#59636E">ボタンに任意のコールバックは持たせられま</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">せん。ひとつの型付きカタログにあるコマン</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">ドに結び付け、引数・エラー・リトライ方針</text><text x="0.0" y="115.2" font-size="14" fill="#59636E">を UI、コマンドライン、JSON、MCP で共有</text><text x="0.0" y="137.2" font-size="14" fill="#59636E">します。</text></g>
<g transform="translate(336.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7 5.5-5.5"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">コンパイル時にチェック</text><text x="0.0" y="49.2" font-size="14" fill="#59636E"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">rustc</tspan> がすべてのバインディングとコマンド</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">引数を型検査します。コマンドのないボタ</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">ン、任意のコールバック、エンジン状態を書</text><text x="0.0" y="115.2" font-size="14" fill="#59636E">き換えるコントロール、翻訳漏れはコンパイ</text><text x="0.0" y="137.2" font-size="14" fill="#59636E">ルできません。</text></g>
<g transform="translate(672.0 0.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">ロジックは Rust のまま</text><text x="0.0" y="49.2" font-size="14" fill="#59636E">エンジンは UI に依存しない普通の Rust コ</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">ードで、ウィンドウなしでテストできます。</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">デスクトップではアプリのプロセス内で、ブ</text><text x="0.0" y="115.2" font-size="14" fill="#59636E">ラウザーでは WebAssembly として動きま</text><text x="0.0" y="137.2" font-size="14" fill="#59636E">す。</text></g>
<g transform="translate(0.0 184.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.8" ry="9"/><path d="M3 12h18"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">初日からローカライズ</text><text x="0.0" y="49.2" font-size="14" fill="#59636E"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">tr!</tspan> で各言語の文言を UI のすぐ隣に置きま</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">す。厳格モードのビルドは翻訳漏れを拒否</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">し、実行中に言語を切り替えても入力中の内</text><text x="0.0" y="115.2" font-size="14" fill="#59636E">容は失われません。</text></g>
<g transform="translate(336.0 184.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">ダークモードは設定不要</text><text x="0.0" y="49.2" font-size="14" fill="#59636E">色はプラットフォームのテーマから来ます。</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">ダークモード、アクセントカラー、ハイコン</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">トラストはシステムに従い、宣言したブラン</text><text x="0.0" y="115.2" font-size="14" fill="#59636E">ドカラーはシステムのアクセントカラーにな</text><text x="0.0" y="137.2" font-size="14" fill="#59636E">ります。Web では Bern のテーマカーネルが</text><text x="0.0" y="159.2" font-size="14" fill="#59636E">配色一式を生成します。</text></g>
<g transform="translate(672.0 184.0)"><g transform="translate(1.0 2.0) scale(0.9167)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><rect x="3" y="8.5" width="13" height="11" rx="2.5"/><path d="M8 8.5V7a2.5 2.5 0 0 1 2.5-2.5h8A2.5 2.5 0 0 1 21 7v6a2.5 2.5 0 0 1-2.5 2.5H16"/></g><text x="34.0" y="18.1" font-size="17" fill="#1F2328" font-weight="700">宣言的マルチウィンドウ</text><text x="0.0" y="49.2" font-size="14" fill="#59636E">各ウィンドウが下書き、閉じる前のチェッ</text><text x="0.0" y="71.2" font-size="14" fill="#59636E">ク、保存コマンドを持ちます。最小化・最大</text><text x="0.0" y="93.2" font-size="14" fill="#59636E">化・移動・リサイズもコマンドで、プラット</text><text x="0.0" y="115.2" font-size="14" fill="#59636E">フォームの実際の状態で応答します。</text></g>
</svg>
