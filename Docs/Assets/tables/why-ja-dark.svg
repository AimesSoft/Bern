<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 505.0" width="960" height="505.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#484F58"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6EA2F5"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="504.0" rx="20" fill="#0D1117" stroke="#30363D"/>
<rect x="24.0" y="24" width="293.3333333333333" height="457.0" rx="14" fill="#151B23" stroke="#30363D"/>
<g transform="translate(24.0 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#14243D"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#6EA2F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18"/></g><text x="22.0" y="93.8" font-size="17.5" fill="#F0F6FC" font-weight="700">ネイティブ UI へコンパイル</text><text x="22.0" y="126.3" font-size="14.5" fill="#F0F6FC">一つの Rust 宣言を、SwiftUI、</text><text x="22.0" y="148.3" font-size="14.5" fill="#F0F6FC">WinUI 3、GTK 4、Jetpack</text><text x="22.0" y="170.3" font-size="14.5" fill="#F0F6FC">Compose、Web へコンパイルしま</text><text x="22.0" y="192.3" font-size="14.5" fill="#F0F6FC">す。</text><g transform="translate(21.0 212.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="44.0" y="224.2" font-size="14" fill="#F0F6FC">各プラットフォーム自身の UI コー</text><text x="44.0" y="246.2" font-size="14" fill="#F0F6FC">ドをビルド時に生成</text><g transform="translate(21.0 258.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="44.0" y="270.2" font-size="14" fill="#F0F6FC">実行時に JS エンジンも仮想 DOM</text><text x="44.0" y="292.2" font-size="14" fill="#F0F6FC">もない</text><g transform="translate(21.0 304.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="44.0" y="316.2" font-size="14" fill="#F0F6FC">UI はシステムのコントロールその</text><text x="44.0" y="338.2" font-size="14" fill="#F0F6FC">もの</text><text x="22.0" y="370.6" font-size="13" fill="#9198A1">目指すところは React Native に近く、</text><text x="22.0" y="390.1" font-size="13" fill="#9198A1">やり方が違います。React Native は実</text><text x="22.0" y="409.6" font-size="13" fill="#9198A1">行時に JS エンジンからネイティブビュー</text><text x="22.0" y="429.1" font-size="13" fill="#9198A1">を調整します。</text></g>
<rect x="333.3333333333333" y="24" width="293.3333333333333" height="457.0" rx="14" fill="#151B23" stroke="#30363D"/>
<g transform="translate(333.3 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#14243D"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#6EA2F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M11 3.5c.6 4.3 3.2 6.9 7.5 7.5-4.3.6-6.9 3.2-7.5 7.5-.6-4.3-3.2-6.9-7.5-7.5 4.3-.6 6.9-3.2 7.5-7.5z"/><path d="M19 15.5v5M16.5 18h5"/></g><text x="22.0" y="93.8" font-size="17.5" fill="#F0F6FC" font-weight="700">AI のための設計：正しく書け</text><text x="22.0" y="118.8" font-size="17.5" fill="#F0F6FC" font-weight="700">て、すぐ使える</text><rect x="22.0" y="136.0" width="127.4" height="22" rx="11.0" fill="#12273F"/><text x="85.7" y="151.3" font-size="12" font-weight="600" text-anchor="middle" fill="#58A6FF">AI がコードを書く</text><text x="22.0" y="183.2" font-size="14" fill="#F0F6FC">漏れた翻訳、UI の入口、未登録のボタ</text><text x="22.0" y="205.2" font-size="14" fill="#F0F6FC">ン、コマンド化されていない操作は、</text><text x="22.0" y="227.2" font-size="14" fill="#F0F6FC">すべてコンパイルエラーになり、ファ</text><text x="22.0" y="249.2" font-size="14" fill="#F0F6FC">イルと行を指し示します。</text><rect x="22.0" y="266.0" width="127.4" height="22" rx="11.0" fill="#12273F"/><text x="85.7" y="281.3" font-size="12" font-weight="600" text-anchor="middle" fill="#58A6FF">AI がアプリを使う</text><text x="22.0" y="313.2" font-size="14" fill="#F0F6FC">どのボタンも MCP ツールです。コント</text><text x="22.0" y="335.2" font-size="14" fill="#F0F6FC">ロールの意味を読み、マウスのクリッ</text><text x="22.0" y="357.2" font-size="14" fill="#F0F6FC">クと同じコードを通ります。スクリー</text><text x="22.0" y="379.2" font-size="14" fill="#F0F6FC">ンショットにも座標にも頼りません。</text></g>
<rect x="642.6666666666666" y="24" width="293.3333333333333" height="457.0" rx="14" fill="#151B23" stroke="#30363D"/>
<g transform="translate(642.7 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#14243D"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#6EA2F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5z"/></g><text x="22.0" y="93.8" font-size="17.5" fill="#F0F6FC" font-weight="700">クロスプラットフォームとは</text><text x="22.0" y="118.8" font-size="17.5" fill="#F0F6FC" font-weight="700">思えない軽さ</text><text x="22.0" y="151.2" font-size="14" fill="#F0F6FC">デスクトップにはブラウザーエンジン</text><text x="22.0" y="173.2" font-size="14" fill="#F0F6FC">も JS エンジンもなく、業務エンジン</text><text x="22.0" y="195.2" font-size="14" fill="#F0F6FC">はネイティブコードにコンパイルさ</text><text x="22.0" y="217.2" font-size="14" fill="#F0F6FC">れ、アプリのプロセス内で動きます。</text><text x="96.0" y="248" font-size="12" fill="#9198A1">メモリ</text><text x="154.4" y="248" font-size="12" fill="#9198A1">表示</text><text x="212.9" y="248" font-size="12" fill="#9198A1">サイズ</text><line x1="22" y1="258.0" x2="271.3333333333333" y2="258.0" stroke="#21262D"/><text x="22" y="278.0" font-size="13" fill="#9198A1">macOS</text><text x="96.0" y="278.0" font-size="14.5" font-weight="700" fill="#F0F6FC">39 MB</text><text x="154.4" y="278.0" font-size="14.5" font-weight="700" fill="#F0F6FC">0.4 秒</text><text x="212.9" y="278.0" font-size="14.5" font-weight="700" fill="#F0F6FC">2.7 MB</text><line x1="22" y1="288.0" x2="271.3333333333333" y2="288.0" stroke="#21262D"/><text x="22" y="308.0" font-size="13" fill="#9198A1">Windows</text><text x="96.0" y="308.0" font-size="14.5" font-weight="700" fill="#F0F6FC">35 MB</text><text x="154.4" y="308.0" font-size="14.5" font-weight="700" fill="#F0F6FC">0.3 秒</text><text x="212.9" y="308.0" font-size="14.5" font-weight="700" fill="#F0F6FC">4.2 MB</text><line x1="22" y1="318.0" x2="271.3333333333333" y2="318.0" stroke="#21262D"/><text x="22" y="338.0" font-size="13" fill="#9198A1">Web</text><text x="96.0" y="338.0" font-size="14.5" font-weight="400" fill="#9198A1">–</text><text x="154.4" y="338.0" font-size="14.5" font-weight="400" fill="#9198A1">–</text><text x="212.9" y="338.0" font-size="14.5" font-weight="700" fill="#F0F6FC">189 KB</text><text x="22.0" y="371.6" font-size="13" fill="#9198A1">release ビルドのショーケースの実測。</text><text x="22.0" y="391.1" font-size="13" fill="#9198A1">Windows は .NET 不要、Web は gzip 後</text><text x="22.0" y="410.6" font-size="13" fill="#9198A1">で Rust エンジン込み。</text></g>
</svg>
