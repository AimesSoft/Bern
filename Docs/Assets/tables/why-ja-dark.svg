<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 371" width="960" height="371" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<g transform="translate(0.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">ネイティブ UI へコンパイル</text><text x="0.0" y="93.3" font-size="14.5" fill="#F0F6FC">Rust で一度書けば、ビルド時に</text><text x="0.0" y="115.3" font-size="14.5" fill="#F0F6FC">SwiftUI、WinUI 3、GTK 4、Compose、</text><text x="0.0" y="137.3" font-size="14.5" fill="#F0F6FC">GPUI、Web を生成します。</text><g transform="translate(0.0 157.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="169.2" font-size="14" fill="#F0F6FC">OS 標準のコントロール、既定で</text><text x="22.0" y="191.2" font-size="14" fill="#F0F6FC">WebView なし</text><g transform="translate(0.0 203.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="215.2" font-size="14" fill="#F0F6FC">外観・ダークモード・IME は OS に準拠</text><g transform="translate(0.0 227.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="239.2" font-size="14" fill="#F0F6FC">統一 GPU 描画は <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">ui</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">=</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">"gpui"</tspan> で切替</text><text x="0.0" y="271.6" font-size="13" fill="#9198A1">ブラウザー同梱も、Swift / C++ / Kotlin の</text><text x="0.0" y="291.1" font-size="13" fill="#9198A1">手書き糊付けコードも不要です。</text></g>
<g transform="translate(336.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">すべて Rust、ロジックと UI を</text><text x="0.0" y="86.4" font-size="18" fill="#F0F6FC" font-weight="700">分離</text><text x="0.0" y="119.3" font-size="14.5" fill="#F0F6FC">プロトコルで状態とコマンドを定義し、普</text><text x="0.0" y="141.3" font-size="14.5" fill="#F0F6FC">通の Rust でエンジン、<tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.3" fill="#79C0FF">ui!</tspan> で画面を書き</text><text x="0.0" y="163.3" font-size="14.5" fill="#F0F6FC">ます。</text><g transform="translate(0.0 183.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="195.2" font-size="14" fill="#F0F6FC">UI 非依存の業務ロジックを <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">cargo</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">test</tspan></text><text x="22.0" y="217.2" font-size="14" fill="#F0F6FC">で単体検証</text><g transform="translate(0.0 229.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="241.2" font-size="14" fill="#F0F6FC">翻訳漏れ・入口忘れ・誤バインドはコンパ</text><text x="22.0" y="263.2" font-size="14" fill="#F0F6FC">イルエラー</text><g transform="translate(0.0 275.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="287.2" font-size="14" fill="#F0F6FC">全操作がコマンド化され、CLI と</text><text x="22.0" y="309.2" font-size="14" fill="#F0F6FC"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#79C0FF">SKILL.md</tspan> を自動生成</text><text x="0.0" y="341.6" font-size="13" fill="#9198A1">人にも AI にも扱いやすい設計：コンパイラーが</text><text x="0.0" y="361.1" font-size="13" fill="#9198A1">漏れを防ぎ、意味ベースで操作できます。</text></g>
<g transform="translate(672.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5z"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">クロスプラットフォームとは思え</text><text x="0.0" y="86.4" font-size="18" fill="#F0F6FC" font-weight="700">ない軽さ</text><text x="0.0" y="119.2" font-size="14" fill="#F0F6FC">デスクトップは既定でブラウザーも JS エン</text><text x="0.0" y="141.2" font-size="14" fill="#F0F6FC">ジンも不要。Rust エンジンは同一プロセス</text><text x="0.0" y="163.2" font-size="14" fill="#F0F6FC">でネイティブ動作します。</text><text x="74.0" y="194" font-size="12" fill="#9198A1">メモリ</text><text x="145.3" y="194" font-size="12" fill="#9198A1">表示</text><text x="216.7" y="194" font-size="12" fill="#9198A1">サイズ</text><line x1="0" y1="204.0" x2="288.0" y2="204.0" stroke="#21262D"/><text x="0" y="224.0" font-size="13" fill="#9198A1">macOS</text><text x="74.0" y="224.0" font-size="14.5" font-weight="700" fill="#F0F6FC">39 MB</text><text x="145.3" y="224.0" font-size="14.5" font-weight="700" fill="#F0F6FC">0.4 秒</text><text x="216.7" y="224.0" font-size="14.5" font-weight="700" fill="#F0F6FC">2.7 MB</text><line x1="0" y1="234.0" x2="288.0" y2="234.0" stroke="#21262D"/><text x="0" y="254.0" font-size="13" fill="#9198A1">Windows</text><text x="74.0" y="254.0" font-size="14.5" font-weight="700" fill="#F0F6FC">35 MB</text><text x="145.3" y="254.0" font-size="14.5" font-weight="700" fill="#F0F6FC">0.3 秒</text><text x="216.7" y="254.0" font-size="14.5" font-weight="700" fill="#F0F6FC">4.2 MB</text><line x1="0" y1="264.0" x2="288.0" y2="264.0" stroke="#21262D"/><text x="0" y="284.0" font-size="13" fill="#9198A1">Web</text><text x="74.0" y="284.0" font-size="14.5" font-weight="400" fill="#484F58">–</text><text x="145.3" y="284.0" font-size="14.5" font-weight="400" fill="#484F58">–</text><text x="216.7" y="284.0" font-size="14.5" font-weight="700" fill="#F0F6FC">189 KB</text><text x="0.0" y="317.6" font-size="13" fill="#9198A1">release ビルドのショーケースの実測。</text><text x="0.0" y="337.1" font-size="13" fill="#9198A1">Windows は .NET 不要、Web は gzip 後で</text><text x="0.0" y="356.6" font-size="13" fill="#9198A1">Rust エンジン込み。</text></g>
</svg>
