<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" width="960" height="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<g transform="translate(0.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">ネイティブ UI へコンパイル</text><text x="0.0" y="93.3" font-size="14.5" fill="#F0F6FC">一つの Rust 宣言を、SwiftUI、WinUI</text><text x="0.0" y="115.3" font-size="14.5" fill="#F0F6FC">3、GTK 4、Jetpack Compose、Web へコ</text><text x="0.0" y="137.3" font-size="14.5" fill="#F0F6FC">ンパイルします。</text><g transform="translate(0.0 157.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="169.2" font-size="14" fill="#F0F6FC">各プラットフォーム自身の UI コードをビ</text><text x="22.0" y="191.2" font-size="14" fill="#F0F6FC">ルド時に生成</text><g transform="translate(0.0 203.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="215.2" font-size="14" fill="#F0F6FC">実行時に JS エンジンも仮想 DOM もない</text><g transform="translate(0.0 227.5) scale(0.6250)" fill="none" stroke="#6EA2F5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="239.2" font-size="14" fill="#F0F6FC">UI はシステムのコントロールそのもの</text><text x="0.0" y="271.6" font-size="13" fill="#9198A1">目指すところは React Native に近く、やり方</text><text x="0.0" y="291.1" font-size="13" fill="#9198A1">が違います。React Native は実行時に JS エン</text><text x="0.0" y="310.6" font-size="13" fill="#9198A1">ジンからネイティブビューを調整します。</text></g>
<g transform="translate(336.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M11 3.5c.6 4.3 3.2 6.9 7.5 7.5-4.3.6-6.9 3.2-7.5 7.5-.6-4.3-3.2-6.9-7.5-7.5 4.3-.6 6.9-3.2 7.5-7.5z"/><path d="M19 15.5v5M16.5 18h5"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">AI のための設計：正しく書け</text><text x="0.0" y="86.4" font-size="18" fill="#F0F6FC" font-weight="700">て、すぐ使える</text><text x="0.0" y="117.0" font-size="12.5" font-weight="700" fill="#6EA2F5">AI がコードを書く</text><text x="0.0" y="141.2" font-size="14" fill="#F0F6FC">漏れた翻訳、UI の入口、未登録のボタン、コ</text><text x="0.0" y="163.2" font-size="14" fill="#F0F6FC">マンド化されていない操作は、すべてコンパ</text><text x="0.0" y="185.2" font-size="14" fill="#F0F6FC">イルエラーになり、ファイルと行を指し示し</text><text x="0.0" y="207.2" font-size="14" fill="#F0F6FC">ます。</text><text x="0.0" y="237.0" font-size="12.5" font-weight="700" fill="#6EA2F5">AI がアプリを使う</text><text x="0.0" y="261.2" font-size="14" fill="#F0F6FC">どのボタンも MCP ツールです。コントロール</text><text x="0.0" y="283.2" font-size="14" fill="#F0F6FC">の意味を読み、マウスのクリックと同じコー</text><text x="0.0" y="305.2" font-size="14" fill="#F0F6FC">ドを通ります。スクリーンショットにも座標</text><text x="0.0" y="327.2" font-size="14" fill="#F0F6FC">にも頼りません。</text></g>
<g transform="translate(672.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#6EA2F5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6EA2F5"><path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5z"/></g><text x="0.0" y="60.4" font-size="18" fill="#F0F6FC" font-weight="700">クロスプラットフォームとは思え</text><text x="0.0" y="86.4" font-size="18" fill="#F0F6FC" font-weight="700">ない軽さ</text><text x="0.0" y="119.2" font-size="14" fill="#F0F6FC">デスクトップにはブラウザーエンジンも JS</text><text x="0.0" y="141.2" font-size="14" fill="#F0F6FC">エンジンもなく、業務エンジンはネイティブ</text><text x="0.0" y="163.2" font-size="14" fill="#F0F6FC">コードにコンパイルされ、アプリのプロセス</text><text x="0.0" y="185.2" font-size="14" fill="#F0F6FC">内で動きます。</text><text x="74.0" y="216" font-size="12" fill="#9198A1">メモリ</text><text x="145.3" y="216" font-size="12" fill="#9198A1">表示</text><text x="216.7" y="216" font-size="12" fill="#9198A1">サイズ</text><line x1="0" y1="226.0" x2="288.0" y2="226.0" stroke="#21262D"/><text x="0" y="246.0" font-size="13" fill="#9198A1">macOS</text><text x="74.0" y="246.0" font-size="14.5" font-weight="700" fill="#F0F6FC">39 MB</text><text x="145.3" y="246.0" font-size="14.5" font-weight="700" fill="#F0F6FC">0.4 秒</text><text x="216.7" y="246.0" font-size="14.5" font-weight="700" fill="#F0F6FC">2.7 MB</text><line x1="0" y1="256.0" x2="288.0" y2="256.0" stroke="#21262D"/><text x="0" y="276.0" font-size="13" fill="#9198A1">Windows</text><text x="74.0" y="276.0" font-size="14.5" font-weight="700" fill="#F0F6FC">35 MB</text><text x="145.3" y="276.0" font-size="14.5" font-weight="700" fill="#F0F6FC">0.3 秒</text><text x="216.7" y="276.0" font-size="14.5" font-weight="700" fill="#F0F6FC">4.2 MB</text><line x1="0" y1="286.0" x2="288.0" y2="286.0" stroke="#21262D"/><text x="0" y="306.0" font-size="13" fill="#9198A1">Web</text><text x="74.0" y="306.0" font-size="14.5" font-weight="400" fill="#484F58">–</text><text x="145.3" y="306.0" font-size="14.5" font-weight="400" fill="#484F58">–</text><text x="216.7" y="306.0" font-size="14.5" font-weight="700" fill="#F0F6FC">189 KB</text><text x="0.0" y="339.6" font-size="13" fill="#9198A1">release ビルドのショーケースの実測。</text><text x="0.0" y="359.1" font-size="13" fill="#9198A1">Windows は .NET 不要、Web は gzip 後で</text><text x="0.0" y="378.6" font-size="13" fill="#9198A1">Rust エンジン込み。</text></g>
</svg>
