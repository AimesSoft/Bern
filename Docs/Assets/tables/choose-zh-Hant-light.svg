<g transform="translate(0.0 436.0)"><circle cx="14.0" cy="14.0" r="14.0" fill="#084CCF"/><path d="M2.25 1.5a.75.75 0 0 0-.75.75v16.5H0V2.25A2.25 2.25 0 0 1 2.25 0h20.095c1.002 0 1.504 1.212.795 1.92L10.764 14.298h3.486V12.75h1.5v1.922a1.125 1.125 0 0 1-1.125 1.125H9.264l-2.578 2.578h11.689V9h1.5v9.375a1.5 1.5 0 0 1-1.5 1.5H5.185L2.562 22.5H21.75a.75.75 0 0 0 .75-.75V5.25H24v16.5A2.25 2.25 0 0 1 21.75 24H1.655C.653 24 .151 22.788.86 22.08L13.19 9.75H9.75v1.5h-1.5V9.375A1.125 1.125 0 0 1 9.375 8.25h5.314l2.625-2.625H5.625V15h-1.5V5.625a1.5 1.5 0 0 1 1.5-1.5h13.19L21.438 1.5z" fill="#FFFFFF" transform="translate(6.30 6.30) scale(0.6417)"/><text x="36" y="19" font-size="14.5" font-weight="700" fill="#1F2328">GPUI</text><text x="0.0" y="55.0" font-size="12.5" font-weight="700" fill="#1A7F37">適合</text><text x="0.0" y="76.5" font-size="13.5" fill="#1F2328">追求極致效能的 Rust 桌面應用程式，例如編輯</text><text x="0.0" y="97.5" font-size="13.5" fill="#1F2328">器。</text><text x="0.0" y="129.0" font-size="12.5" font-weight="700" fill="#9A6700">代價</text><text x="0.0" y="150.6" font-size="13.5" fill="#59636E">自繪介面，常用控制項與無障礙要自己補；只支</text><text x="0.0" y="171.6" font-size="13.5" fill="#59636E">援桌面。</text></g>
<g transform="translate(336.0 436.0)"><circle cx="14.0" cy="14.0" r="14.0" fill="#64748B"/><text x="14.0" y="19.0" text-anchor="middle" font-size="14.0" font-weight="700" fill="#FFFFFF">D</text><text x="36" y="19" font-size="14.5" font-weight="700" fill="#1F2328">Dioxus</text><text x="0.0" y="55.0" font-size="12.5" font-weight="700" fill="#1A7F37">適合</text><text x="0.0" y="76.5" font-size="13.5" fill="#1F2328">喜歡 React 寫法的 Rust 全端專案，一套程式</text><text x="0.0" y="97.5" font-size="13.5" fill="#1F2328">碼涵蓋 Web、桌面與行動端。</text><text x="0.0" y="129.0" font-size="12.5" font-weight="700" fill="#9A6700">代價</text><text x="0.0" y="150.6" font-size="13.5" fill="#59636E">桌面與行動端目前是 WebView 介面；原生繪製</text><text x="0.0" y="171.6" font-size="13.5" fill="#59636E">器仍在實驗。</text></g>
<g transform="translate(672.0 436.0)"><circle cx="14.0" cy="14.0" r="14.0" fill="#64748B"/><text x="14.0" y="19.0" text-anchor="middle" font-size="14.0" font-weight="700" fill="#FFFFFF">U</text><text x="36" y="19" font-size="14.5" font-weight="700" fill="#1F2328">uni-app</text><text x="0.0" y="55.0" font-size="12.5" font-weight="700" fill="#1A7F37">適合</text><text x="0.0" y="76.5" font-size="13.5" fill="#1F2328">中國大陸多端（小程式、App、H5、鴻蒙）一套</text><text x="0.0" y="97.5" font-size="13.5" fill="#1F2328">程式碼。</text><text x="0.0" y="129.0" font-size="12.5" font-weight="700" fill="#9A6700">代價</text><text x="0.0" y="150.6" font-size="13.5" fill="#59636E">沒有桌面應用程式目標；經典模式的 App 介面</text><text x="0.0" y="171.6" font-size="13.5" fill="#59636E">是 WebView。</text></g>
<line x1="0" y1="646.0" x2="960" y2="646.0" stroke="#D0D7DE"/>
<use href="#bern-logo" x="0.0" y="674.0" width="32.0" height="32.0"/><text x="40" y="695" font-size="14.5" font-weight="700" fill="#4A8BEF">Bern</text>
<text x="0.0" y="729.0" font-size="12.5" font-weight="700" fill="#1A7F37">適合</text>
<text x="0.0" y="750.5" font-size="13.5" fill="#1F2328">桌面與 Android 應用程式要每個平台的系統外觀，商業邏輯寫在 Rust</text>
<text x="0.0" y="771.5" font-size="13.5" fill="#1F2328">裡，並希望 AI 既能寫它、也能用它。</text>
<text x="504.0" y="729.0" font-size="12.5" font-weight="700" fill="#9A6700">暫不適合</text>
<text x="504.0" y="750.5" font-size="13.5" fill="#59636E">現在就要上架 iOS（實機簽署與打包尚未完成），或依賴成熟的第三方元件</text>
<text x="504.0" y="771.5" font-size="13.5" fill="#59636E">生態。Bern 仍是早期預覽。</text>
</svg>
