<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<g transform="translate(0.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18"/></g><text x="0.0" y="60.4" font-size="18" fill="#1F2328" font-weight="700">Compiled into native UI</text><text x="0.0" y="93.3" font-size="14.5" fill="#1F2328">Write UI once in Rust; Bern</text><text x="0.0" y="115.3" font-size="14.5" fill="#1F2328">generates SwiftUI, WinUI 3, GTK 4,</text><text x="0.0" y="137.3" font-size="14.5" fill="#1F2328">Compose, GPUI and Web code.</text><g transform="translate(0.0 157.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="169.2" font-size="14" fill="#1F2328">Real OS controls, zero WebView by</text><text x="22.0" y="191.2" font-size="14" fill="#1F2328">default</text><g transform="translate(0.0 203.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="215.2" font-size="14" fill="#1F2328">Look, dark mode, IME and a11y from</text><text x="22.0" y="237.2" font-size="14" fill="#1F2328">the OS</text><g transform="translate(0.0 249.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="261.2" font-size="14" fill="#1F2328">Switch to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">ui</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">=</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">"gpui"</tspan> for unified</text><text x="22.0" y="283.2" font-size="14" fill="#1F2328">GPU UI</text><text x="0.0" y="315.6" font-size="13" fill="#59636E">Zero lock-in: run <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.0" fill="#0550AE">bern</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.0" fill="#0550AE">eject</tspan> anytime for</text><text x="0.0" y="335.1" font-size="13" fill="#59636E">standalone native IDE projects with</text><text x="0.0" y="354.6" font-size="13" fill="#59636E">Rust FFI wired up — also a quick</text><text x="0.0" y="374.1" font-size="13" fill="#59636E">native-to-Rust starter.</text></g>
<g transform="translate(336.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M8.5 7 3.5 12l5 5M15.5 7l5 5-5 5"/></g><text x="0.0" y="60.4" font-size="18" fill="#1F2328" font-weight="700">All Rust, clean separation</text><text x="0.0" y="93.3" font-size="14.5" fill="#1F2328">A protocol declares state and</text><text x="0.0" y="115.3" font-size="14.5" fill="#1F2328">commands; plain Rust runs the</text><text x="0.0" y="137.3" font-size="14.5" fill="#1F2328">engine; <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.3" fill="#0550AE">ui!</tspan> declares views.</text><g transform="translate(0.0 157.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="169.2" font-size="14" fill="#1F2328">UI-free logic: any Rust crate,</text><text x="22.0" y="191.2" font-size="14" fill="#1F2328">plain <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">cargo</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">test</tspan></text><g transform="translate(0.0 203.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="215.2" font-size="14" fill="#1F2328">Missing translations and entries</text><text x="22.0" y="237.2" font-size="14" fill="#1F2328">fail to compile</text><g transform="translate(0.0 249.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="261.2" font-size="14" fill="#1F2328">Command-driven: ships app CLI and</text><text x="22.0" y="283.2" font-size="14" fill="#1F2328"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.9" fill="#0550AE">SKILL.md</tspan></text><text x="0.0" y="315.6" font-size="13" fill="#59636E">Built for humans and AI alike: the</text><text x="0.0" y="335.1" font-size="13" fill="#59636E">compiler catches omissions and agents</text><text x="0.0" y="354.6" font-size="13" fill="#59636E">drive the app semantically.</text></g>
<g transform="translate(672.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5z"/></g><text x="0.0" y="60.4" font-size="18" fill="#1F2328" font-weight="700">Too light to feel</text><text x="0.0" y="86.4" font-size="18" fill="#1F2328" font-weight="700">cross-platform</text><text x="0.0" y="119.2" font-size="14" fill="#1F2328">No browser or JS engine on the</text><text x="0.0" y="141.2" font-size="14" fill="#1F2328">desktop by default; the Rust engine</text><text x="0.0" y="163.2" font-size="14" fill="#1F2328">compiles to native code in process.</text><text x="74.0" y="194" font-size="12" fill="#59636E">Memory</text><text x="145.3" y="194" font-size="12" fill="#59636E">Window</text><text x="216.7" y="194" font-size="12" fill="#59636E">Size</text><line x1="0" y1="204.0" x2="288.0" y2="204.0" stroke="#E6EAEF"/><text x="0" y="224.0" font-size="13" fill="#59636E">macOS</text><text x="74.0" y="224.0" font-size="14.5" font-weight="700" fill="#1F2328">39 MB</text><text x="145.3" y="224.0" font-size="14.5" font-weight="700" fill="#1F2328">0.4 s</text><text x="216.7" y="224.0" font-size="14.5" font-weight="700" fill="#1F2328">2.7 MB</text><line x1="0" y1="234.0" x2="288.0" y2="234.0" stroke="#E6EAEF"/><text x="0" y="254.0" font-size="13" fill="#59636E">Windows</text><text x="74.0" y="254.0" font-size="14.5" font-weight="700" fill="#1F2328">35 MB</text><text x="145.3" y="254.0" font-size="14.5" font-weight="700" fill="#1F2328">0.3 s</text><text x="216.7" y="254.0" font-size="14.5" font-weight="700" fill="#1F2328">4.2 MB</text><line x1="0" y1="264.0" x2="288.0" y2="264.0" stroke="#E6EAEF"/><text x="0" y="284.0" font-size="13" fill="#59636E">Web</text><text x="74.0" y="284.0" font-size="14.5" font-weight="400" fill="#AFB8C1">–</text><text x="145.3" y="284.0" font-size="14.5" font-weight="400" fill="#AFB8C1">–</text><text x="216.7" y="284.0" font-size="14.5" font-weight="700" fill="#1F2328">189 KB</text><text x="0.0" y="317.6" font-size="13" fill="#59636E">Measured on the release showcase. No</text><text x="0.0" y="337.1" font-size="13" fill="#59636E">.NET on Windows; the web figure is</text><text x="0.0" y="356.6" font-size="13" fill="#59636E">gzipped and includes the Rust engine.</text></g>
</svg>
