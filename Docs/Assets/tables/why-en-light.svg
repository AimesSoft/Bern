<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" width="960" height="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol></defs>
<g transform="translate(0.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18"/></g><text x="0.0" y="60.4" font-size="18" fill="#1F2328" font-weight="700">Compiled into native UI</text><text x="0.0" y="93.3" font-size="14.5" fill="#1F2328">One Rust declaration compiles into</text><text x="0.0" y="115.3" font-size="14.5" fill="#1F2328">SwiftUI, WinUI 3, GTK 4, Jetpack</text><text x="0.0" y="137.3" font-size="14.5" fill="#1F2328">Compose and the Web.</text><g transform="translate(0.0 157.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="169.2" font-size="14" fill="#1F2328">Each platform's own UI code,</text><text x="22.0" y="191.2" font-size="14" fill="#1F2328">generated at build time</text><g transform="translate(0.0 203.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="215.2" font-size="14" fill="#1F2328">No JS engine and no virtual DOM at</text><text x="22.0" y="237.2" font-size="14" fill="#1F2328">runtime</text><g transform="translate(0.0 249.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="22.0" y="261.2" font-size="14" fill="#1F2328">The interface is the system's</text><text x="22.0" y="283.2" font-size="14" fill="#1F2328">controls themselves</text><text x="0.0" y="315.6" font-size="13" fill="#59636E">The goal is close to React Native's; the</text><text x="0.0" y="335.1" font-size="13" fill="#59636E">approach differs: React Native</text><text x="0.0" y="354.6" font-size="13" fill="#59636E">coordinates native views from a JS</text><text x="0.0" y="374.1" font-size="13" fill="#59636E">engine at runtime.</text></g>
<g transform="translate(336.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M11 3.5c.6 4.3 3.2 6.9 7.5 7.5-4.3.6-6.9 3.2-7.5 7.5-.6-4.3-3.2-6.9-7.5-7.5 4.3-.6 6.9-3.2 7.5-7.5z"/><path d="M19 15.5v5M16.5 18h5"/></g><text x="0.0" y="60.4" font-size="18" fill="#1F2328" font-weight="700">Built for AI: written</text><text x="0.0" y="86.4" font-size="18" fill="#1F2328" font-weight="700">right, ready to use</text><text x="0.0" y="117.0" font-size="12.5" font-weight="700" fill="#4A8BEF">AI writing code</text><text x="0.0" y="141.2" font-size="14" fill="#1F2328">Forgotten translations, missing UI</text><text x="0.0" y="163.2" font-size="14" fill="#1F2328">entry points, unregistered buttons</text><text x="0.0" y="185.2" font-size="14" fill="#1F2328">and actions without a command are</text><text x="0.0" y="207.2" font-size="14" fill="#1F2328">compile errors, pointing at the file</text><text x="0.0" y="229.2" font-size="14" fill="#1F2328">and line.</text><text x="0.0" y="259.0" font-size="12.5" font-weight="700" fill="#4A8BEF">AI using the app</text><text x="0.0" y="283.2" font-size="14" fill="#1F2328">Every button is an MCP tool: it reads</text><text x="0.0" y="305.2" font-size="14" fill="#1F2328">what the controls mean and takes the</text><text x="0.0" y="327.2" font-size="14" fill="#1F2328">same code path as a mouse click, with</text><text x="0.0" y="349.2" font-size="14" fill="#1F2328">no screenshots and no coordinates.</text></g>
<g transform="translate(672.0 0.0)"><g transform="translate(1.0 1.0) scale(1.1667)" fill="none" stroke="#4A8BEF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5z"/></g><text x="0.0" y="60.4" font-size="18" fill="#1F2328" font-weight="700">Too light to feel</text><text x="0.0" y="86.4" font-size="18" fill="#1F2328" font-weight="700">cross-platform</text><text x="0.0" y="119.2" font-size="14" fill="#1F2328">No browser engine and no JS engine on</text><text x="0.0" y="141.2" font-size="14" fill="#1F2328">the desktop; the business engine</text><text x="0.0" y="163.2" font-size="14" fill="#1F2328">compiles to native code and runs in</text><text x="0.0" y="185.2" font-size="14" fill="#1F2328">the app process.</text><text x="74.0" y="216" font-size="12" fill="#59636E">Memory</text><text x="145.3" y="216" font-size="12" fill="#59636E">Window</text><text x="216.7" y="216" font-size="12" fill="#59636E">Size</text><line x1="0" y1="226.0" x2="288.0" y2="226.0" stroke="#E6EAEF"/><text x="0" y="246.0" font-size="13" fill="#59636E">macOS</text><text x="74.0" y="246.0" font-size="14.5" font-weight="700" fill="#1F2328">39 MB</text><text x="145.3" y="246.0" font-size="14.5" font-weight="700" fill="#1F2328">0.4 s</text><text x="216.7" y="246.0" font-size="14.5" font-weight="700" fill="#1F2328">2.7 MB</text><line x1="0" y1="256.0" x2="288.0" y2="256.0" stroke="#E6EAEF"/><text x="0" y="276.0" font-size="13" fill="#59636E">Windows</text><text x="74.0" y="276.0" font-size="14.5" font-weight="700" fill="#1F2328">35 MB</text><text x="145.3" y="276.0" font-size="14.5" font-weight="700" fill="#1F2328">0.3 s</text><text x="216.7" y="276.0" font-size="14.5" font-weight="700" fill="#1F2328">4.2 MB</text><line x1="0" y1="286.0" x2="288.0" y2="286.0" stroke="#E6EAEF"/><text x="0" y="306.0" font-size="13" fill="#59636E">Web</text><text x="74.0" y="306.0" font-size="14.5" font-weight="400" fill="#AFB8C1">–</text><text x="145.3" y="306.0" font-size="14.5" font-weight="400" fill="#AFB8C1">–</text><text x="216.7" y="306.0" font-size="14.5" font-weight="700" fill="#1F2328">189 KB</text><text x="0.0" y="339.6" font-size="13" fill="#59636E">Measured on the release showcase. No</text><text x="0.0" y="359.1" font-size="13" fill="#59636E">.NET on Windows; the web figure is</text><text x="0.0" y="378.6" font-size="13" fill="#59636E">gzipped and includes the Rust engine.</text></g>
</svg>
