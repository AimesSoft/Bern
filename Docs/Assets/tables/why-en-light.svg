<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528.0" width="960" height="528.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Helvetica Neue', Arial, sans-serif">
<defs><symbol id="bern-logo" viewBox="0 0 1024 1024"><defs>
    <clipPath id="bern-symbol-disc"><circle cx="512" cy="512" r="512"/></clipPath>
  </defs>
  <g clip-path="url(#bern-symbol-disc)">
    
    <rect width="1024" height="1024" fill="#4A8BEF"/>
    
    <path fill="#24324D" d="M 290.4 372.1 C 270.7 579.3 309.8 827.6 392.0 1060.0 L 1100 1100 L 1060.0 880.0 C 1013.0 692.2 904.4 451.5 684.3 270.5 A 14 14 0 0 0 662.4 286.5 C 693.7 364.2 711.6 444.8 715.3 529.4 A 36 36 0 0 1 691.6 564.9 C 620.6 590.7 549.5 616.5 478.5 642.4 A 36 36 0 0 1 436.0 628.1 C 383.8 547.6 344.6 461.1 317.8 369.5 A 14 14 0 0 0 290.4 372.1 Z"/>
    
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(520 760) rotate(-20)"/>
    <ellipse rx="22" ry="36" fill="#E8F4FF" transform="translate(748 668) rotate(-20)"/>
  </g>
</symbol><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#AFB8C1"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4A8BEF"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="527.0" rx="20" fill="#FFFFFF" stroke="#D0D7DE"/>
<rect x="24.0" y="24" width="293.3333333333333" height="480.0" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(24.0 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18"/></g><text x="22.0" y="93.8" font-size="17.5" fill="#1F2328" font-weight="700">Compiled into native UI</text><text x="22.0" y="126.3" font-size="14.5" fill="#1F2328">One Rust declaration compiles</text><text x="22.0" y="148.3" font-size="14.5" fill="#1F2328">into SwiftUI, WinUI 3, GTK 4,</text><text x="22.0" y="170.3" font-size="14.5" fill="#1F2328">Jetpack Compose and the Web.</text><g transform="translate(21.0 190.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="44.0" y="202.2" font-size="14" fill="#1F2328">Each platform's own UI code,</text><text x="44.0" y="224.2" font-size="14" fill="#1F2328">generated at build time</text><g transform="translate(21.0 236.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="44.0" y="248.2" font-size="14" fill="#1F2328">No JS engine and no virtual</text><text x="44.0" y="270.2" font-size="14" fill="#1F2328">DOM at runtime</text><g transform="translate(21.0 282.5) scale(0.6250)" fill="none" stroke="#4A8BEF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="m5 12.5 4.5 4.5L19 7.5"/></g><text x="44.0" y="294.2" font-size="14" fill="#1F2328">The interface is the system's</text><text x="44.0" y="316.2" font-size="14" fill="#1F2328">controls themselves</text><text x="22.0" y="348.6" font-size="13" fill="#59636E">The goal is close to React</text><text x="22.0" y="368.1" font-size="13" fill="#59636E">Native's; the approach differs:</text><text x="22.0" y="387.6" font-size="13" fill="#59636E">React Native coordinates native</text><text x="22.0" y="407.1" font-size="13" fill="#59636E">views from a JS engine at runtime.</text></g>
<rect x="333.3333333333333" y="24" width="293.3333333333333" height="480.0" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(333.3 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M11 3.5c.6 4.3 3.2 6.9 7.5 7.5-4.3.6-6.9 3.2-7.5 7.5-.6-4.3-3.2-6.9-7.5-7.5 4.3-.6 6.9-3.2 7.5-7.5z"/><path d="M19 15.5v5M16.5 18h5"/></g><text x="22.0" y="93.8" font-size="17.5" fill="#1F2328" font-weight="700">Built for AI: written</text><text x="22.0" y="118.8" font-size="17.5" fill="#1F2328" font-weight="700">right, ready to use</text><rect x="22.0" y="136.0" width="126.3" height="22" rx="11.0" fill="#DDF4FF"/><text x="85.2" y="151.3" font-size="12" font-weight="600" text-anchor="middle" fill="#0969DA">AI writing code</text><text x="22.0" y="183.2" font-size="14" fill="#1F2328">Forgotten translations, missing</text><text x="22.0" y="205.2" font-size="14" fill="#1F2328">UI entry points, unregistered</text><text x="22.0" y="227.2" font-size="14" fill="#1F2328">buttons and actions without a</text><text x="22.0" y="249.2" font-size="14" fill="#1F2328">command are compile errors,</text><text x="22.0" y="271.2" font-size="14" fill="#1F2328">pointing at the file and line.</text><rect x="22.0" y="288.0" width="130.4" height="22" rx="11.0" fill="#DDF4FF"/><text x="87.2" y="303.3" font-size="12" font-weight="600" text-anchor="middle" fill="#0969DA">AI using the app</text><text x="22.0" y="335.2" font-size="14" fill="#1F2328">Every button is an MCP tool: it</text><text x="22.0" y="357.2" font-size="14" fill="#1F2328">reads what the controls mean and</text><text x="22.0" y="379.2" font-size="14" fill="#1F2328">takes the same code path as a</text><text x="22.0" y="401.2" font-size="14" fill="#1F2328">mouse click, with no screenshots</text><text x="22.0" y="423.2" font-size="14" fill="#1F2328">and no coordinates.</text></g>
<rect x="642.6666666666666" y="24" width="293.3333333333333" height="480.0" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/>
<g transform="translate(642.7 24.0)"><rect x="22" y="22" width="40" height="40" rx="11.2" fill="#EAF2FE"/><g transform="translate(30.8 30.8) scale(0.9333)" fill="none" stroke="#4A8BEF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" color="#4A8BEF"><path d="M13.5 2.5 5 13.5h6.5l-1 8 8.5-11h-6.5z"/></g><text x="22.0" y="93.8" font-size="17.5" fill="#1F2328" font-weight="700">Too light to feel</text><text x="22.0" y="118.8" font-size="17.5" fill="#1F2328" font-weight="700">cross-platform</text><text x="22.0" y="151.2" font-size="14" fill="#1F2328">No browser engine and no JS</text><text x="22.0" y="173.2" font-size="14" fill="#1F2328">engine on the desktop; the</text><text x="22.0" y="195.2" font-size="14" fill="#1F2328">business engine compiles to</text><text x="22.0" y="217.2" font-size="14" fill="#1F2328">native code and runs in the app</text><text x="22.0" y="239.2" font-size="14" fill="#1F2328">process.</text><text x="96.0" y="270" font-size="12" fill="#59636E">Memory</text><text x="154.4" y="270" font-size="12" fill="#59636E">Window</text><text x="212.9" y="270" font-size="12" fill="#59636E">Size</text><line x1="22" y1="280.0" x2="271.3333333333333" y2="280.0" stroke="#E6EAEF"/><text x="22" y="300.0" font-size="13" fill="#59636E">macOS</text><text x="96.0" y="300.0" font-size="14.5" font-weight="700" fill="#1F2328">39 MB</text><text x="154.4" y="300.0" font-size="14.5" font-weight="700" fill="#1F2328">0.4 s</text><text x="212.9" y="300.0" font-size="14.5" font-weight="700" fill="#1F2328">2.7 MB</text><line x1="22" y1="310.0" x2="271.3333333333333" y2="310.0" stroke="#E6EAEF"/><text x="22" y="330.0" font-size="13" fill="#59636E">Windows</text><text x="96.0" y="330.0" font-size="14.5" font-weight="700" fill="#1F2328">35 MB</text><text x="154.4" y="330.0" font-size="14.5" font-weight="700" fill="#1F2328">0.3 s</text><text x="212.9" y="330.0" font-size="14.5" font-weight="700" fill="#1F2328">4.2 MB</text><line x1="22" y1="340.0" x2="271.3333333333333" y2="340.0" stroke="#E6EAEF"/><text x="22" y="360.0" font-size="13" fill="#59636E">Web</text><text x="96.0" y="360.0" font-size="14.5" font-weight="400" fill="#59636E">–</text><text x="154.4" y="360.0" font-size="14.5" font-weight="400" fill="#59636E">–</text><text x="212.9" y="360.0" font-size="14.5" font-weight="700" fill="#1F2328">189 KB</text><text x="22.0" y="393.6" font-size="13" fill="#59636E">Measured on the release showcase.</text><text x="22.0" y="413.1" font-size="13" fill="#59636E">No .NET on Windows; the web figure</text><text x="22.0" y="432.6" font-size="13" fill="#59636E">is gzipped and includes the Rust</text><text x="22.0" y="452.1" font-size="13" fill="#59636E">engine.</text></g>
</svg>
